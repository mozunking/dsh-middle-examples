<!doctype html>
<!-- 数据工作台 · 窗口1 主页
     定位：制作「数据看板 / 数据应用」的工具台 —— 问清需求、探明数据、选好看法，派会话去做，验收后挂进项目列表。
     皮肤：/api/worktable/template/dshell.css，本文件只重定义主题变量 + 少量自有结构；不引任何外部资源。
     接口：全部同源 /api/worktable/fs | write | mkdir | file | site | git
     数据解析：内置原生 JS 解析器（CSV/TSV/JSON/JSONL/Markdown/XLSX，含手写 INFLATE），见 工具/解析器.js
     台账：项目根 数据看板目录.json · 数据源目录.json；产出：数据看板/<名>/ -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230a84ff'/%3E%3Cpath d='M4 6.2h8M4 9.8h8' stroke='white' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/api/worktable/template/dshell.css" />
<style>
  /* ================= 浅色科技蓝 · 主题变量层 ================= */
  :root {
    color-scheme: light;
    --dsw-alias-bg-base: #eaf1ff;
    --dsw-alias-fill-l1: #ffffff;
    --dsw-alias-fill-l2: #f4f8ff;
    --dsw-alias-border-l1: #d3e2fb;
    --dsw-alias-border-l2: #a9c8f5;
    --dsw-alias-label-primary: #0a1b33;
    --dsw-alias-label-secondary: #48617f;
    --dsw-alias-label-tertiary: #7d93ae;
    --dsw-alias-state-accent-primary: #0a84ff;
    --dsw-alias-state-success: #127a39;
    --dsw-alias-state-warning: #9a5b00;
    --dsw-alias-state-danger: #a01d15;
    /* 自有语义变量（只用一次的地方也收在这儿，避免散落） */
    --ind: #5e5ce6; --cyan: #5ac8fa;
    --r-s: 12px; --r-m: 18px; --r-l: 26px;
    --sh-card: 0 1px 2px rgba(10,60,120,.05), 0 6px 18px rgba(10,60,120,.06);
    --sh-pop: 0 12px 40px rgba(10,40,90,.16);
    --ease: cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --dsw-alias-bg-base: #0f1725;
    --dsw-alias-fill-l1: #16213a;
    --dsw-alias-fill-l2: #1b2846;
    --dsw-alias-border-l1: #24365c;
    --dsw-alias-border-l2: #33507f;
    --dsw-alias-label-primary: #e8f0fb;
    --dsw-alias-label-secondary: #a9c0dd;
    --dsw-alias-label-tertiary: #7f97b6;
    --dsw-alias-state-accent-primary: #4da3ff;
    --dsw-alias-state-success: #3ecf6f;
    --dsw-alias-state-warning: #e0a04a;
    --dsw-alias-state-danger: #ff6f60;
    --sh-card: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.24);
    --sh-pop: 0 12px 40px rgba(0,0,0,.5);
  }
  body { background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); font-variant-numeric: tabular-nums; }
  /* 发丝线 + 圆角 + 阴影统一到新尺度 */
  .dshell-card { border-radius: var(--r-m); box-shadow: var(--sh-card); background: var(--dsw-alias-fill-l1); }
  .dshell-btn { border-color: transparent; }
  .dshell-btn:not(.dshell-btnGhost):not(.dshell-btnDanger) {
    background: var(--dsw-alias-state-accent-primary); color: #fff;
  }
  html[data-theme="dark"] .dshell-btn:not(.dshell-btnGhost):not(.dshell-btnDanger) { color: #08192e; }
  .dshell-btnGhost { background: var(--dsw-alias-fill-l1); border-color: var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); }
  .dshell-btnGhost:hover { border-color: var(--dsw-alias-border-l2); transform: translateY(-1px); }
  .dshell-btnDanger { background: transparent; border-color: var(--dsw-alias-state-danger); color: var(--dsw-alias-state-danger); }
  .dshell-tab { border-radius: 999px; }
  .dshell-tabOn { background: var(--dsw-alias-fill-l1); border-color: var(--dsw-alias-border-l2); box-shadow: var(--sh-card); }
  .dshell-stat { border-radius: var(--r-m); background: var(--dsw-alias-fill-l1); border: 1px solid var(--dsw-alias-border-l1); }
  .dshell-statValue { color: var(--dsw-alias-state-accent-primary); font-weight: 700; letter-spacing: -.02em; }
  .dshell-input, .dshell-textarea { border-radius: var(--r-s); background: var(--dsw-alias-fill-l1); border: 1px solid var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); }
  .dshell-input::placeholder, .dshell-textarea::placeholder { color: var(--dsw-alias-label-tertiary); }
  .dshell-table th { color: var(--dsw-alias-label-secondary); font-weight: 600; }
  .dshell-listItem { border-radius: var(--r-s); }
  /* 焦点环：键盘可见，鼠标不残留 */
  :focus-visible { outline: 2px solid var(--dsw-alias-state-accent-primary); outline-offset: 2px; border-radius: 6px; }
  .dshell-btn:focus:not(:focus-visible), .dshell-tab:focus:not(:focus-visible), .dshell-input:focus:not(:focus-visible) { outline: none; }

  /* ================= 自有结构层 ================= */
  .dshell { gap: 10px; padding: 12px 14px 26px; max-width: 1180px; margin: 0 auto; }
  .hero {
    position: relative; overflow: hidden; border-radius: var(--r-l); border: 1px solid var(--dsw-alias-border-l1);
    background: var(--dsw-alias-fill-l1); padding: 18px 20px; box-shadow: var(--sh-card);
  }
  .hero::after {  /* 渐隐网格，纯 CSS */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background:
      radial-gradient(420px 160px at 88% -20%, color-mix(in srgb, var(--cyan) 26%, transparent), transparent 70%),
      radial-gradient(360px 200px at 6% 120%, color-mix(in srgb, var(--ind) 16%, transparent), transparent 72%),
      linear-gradient(to right, color-mix(in srgb, var(--dsw-alias-border-l1) 60%, transparent) 1px, transparent 1px) 0 0/38px 38px,
      linear-gradient(to bottom, color-mix(in srgb, var(--dsw-alias-border-l1) 60%, transparent) 1px, transparent 1px) 0 0/38px 38px;
    -webkit-mask-image: radial-gradient(70% 120% at 70% 0%, #000 20%, transparent 100%);
            mask-image: radial-gradient(70% 120% at 70% 0%, #000 20%, transparent 100%);
  }
  .hero-top { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .mark { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 11px;
    background: color-mix(in srgb, var(--dsw-alias-state-accent-primary) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--dsw-alias-state-accent-primary) 26%, transparent); color: var(--dsw-alias-state-accent-primary); }
  .hero h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.03em; }
  .hero p { margin: 3px 0 0; font-size: 12.5px; color: var(--dsw-alias-label-secondary); max-width: 62ch; }
  .hero-act { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lights { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; position: relative; z-index: 1; }
  .light { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dsw-alias-label-secondary);
    border: 1px solid var(--dsw-alias-border-l1); border-radius: 999px; padding: 3px 9px 3px 7px; background: var(--dsw-alias-fill-l1); }
  .light i { width: 7px; height: 7px; border-radius: 50%; background: var(--dsw-alias-label-tertiary); flex: 0 0 auto; }
  .light.ok i { background: var(--dsw-alias-state-success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dsw-alias-state-success) 18%, transparent); }
  .light.warn i { background: var(--dsw-alias-state-warning); }
  .light.bad i { background: var(--dsw-alias-state-danger); }
  .light.pulse i { animation: br 2.4s var(--ease) infinite; }
  @keyframes br { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar-end { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  section { margin-top: 2px; }
  h2.sec { margin: 14px 0 8px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  h3.sub { margin: 0 0 8px; font-size: 13.5px; font-weight: 650; color: var(--dsw-alias-label-primary); }

  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .bcard { border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--r-m); background: var(--dsw-alias-fill-l1);
    padding: 12px 13px; box-shadow: var(--sh-card); display: flex; flex-direction: column; gap: 8px; transition: transform .18s var(--ease), box-shadow .18s var(--ease); }
  .bcard:hover { transform: translateY(-1px); box-shadow: var(--sh-pop); }
  .bcard .ttl { display: flex; align-items: center; gap: 8px; }
  .bcard .ttl b { font-size: 14px; font-weight: 680; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bcard .des { font-size: 12px; color: var(--dsw-alias-label-secondary); min-height: 17px; }
  .meta { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 11px; color: var(--dsw-alias-label-secondary); border: 1px solid var(--dsw-alias-border-l1);
    border-radius: 999px; padding: 1px 8px; background: var(--dsw-alias-fill-l2); }
  .tag.key { color: var(--dsw-alias-state-accent-primary); border-color: color-mix(in srgb, var(--dsw-alias-state-accent-primary) 34%, transparent); }
  .rowbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .miss { font-size: 11.5px; color: var(--dsw-alias-state-warning); background: color-mix(in srgb, var(--dsw-alias-state-warning) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--dsw-alias-state-warning) 30%, transparent); border-radius: 10px; padding: 6px 9px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px 2px 7px;
    border: 1px solid var(--dsw-alias-border-l1); color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-fill-l2); }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.run { color: var(--ind); border-color: color-mix(in srgb, var(--ind) 34%, transparent); background: color-mix(in srgb, var(--ind) 10%, transparent); }
  .badge.wait { color: var(--dsw-alias-state-warning); border-color: color-mix(in srgb, var(--dsw-alias-state-warning) 34%, transparent); background: color-mix(in srgb, var(--dsw-alias-state-warning) 10%, transparent); }
  .badge.done { color: var(--dsw-alias-state-success); border-color: color-mix(in srgb, var(--dsw-alias-state-success) 34%, transparent); background: color-mix(in srgb, var(--dsw-alias-state-success) 10%, transparent); }
  .badge.run i { animation: br 1.8s var(--ease) infinite; }

  /* 向导 */
  .wz { display: grid; grid-template-columns: 176px 1fr; gap: 14px; align-items: start; }
  .steps { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 12px; }
  .step { display: flex; gap: 8px; align-items: center; text-align: left; font: inherit; font-size: 12.5px; padding: 7px 9px;
    border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--dsw-alias-label-secondary); cursor: pointer; }
  .step:hover { background: var(--dsw-alias-fill-l2); }
  .step[aria-current="true"] { background: var(--dsw-alias-fill-l1); border-color: var(--dsw-alias-border-l1); color: var(--dsw-alias-label-primary); font-weight: 600; box-shadow: var(--sh-card); }
  .step .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px;
    border: 1px solid var(--dsw-alias-border-l2); color: var(--dsw-alias-label-tertiary); flex: 0 0 auto; }
  .step.done .n { background: var(--dsw-alias-state-success); border-color: transparent; color: #fff; }
  .fgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .f > label { font-size: 11.5px; color: var(--dsw-alias-label-secondary); font-weight: 600; }
  .f .hint { font-size: 11px; color: var(--dsw-alias-label-tertiary); }
  .radios { display: flex; gap: 6px; flex-wrap: wrap; }
  .radio { font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--dsw-alias-border-l1);
    background: var(--dsw-alias-fill-l1); color: var(--dsw-alias-label-secondary); cursor: pointer; }
  .radio[aria-pressed="true"] { border-color: color-mix(in srgb, var(--dsw-alias-state-accent-primary) 46%, transparent);
    background: color-mix(in srgb, var(--dsw-alias-state-accent-primary) 10%, transparent); color: var(--dsw-alias-state-accent-primary); font-weight: 600; }
  textarea.dshell-textarea { min-height: 74px; resize: vertical; line-height: 1.55; }

  /* 文件浏览器 */
  .browser { border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--r-s); background: var(--dsw-alias-fill-l2); padding: 8px; }
  .crumb { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 11.5px; margin-bottom: 6px; }
  .crumb button { font: inherit; font-size: 11.5px; border: 0; background: transparent; color: var(--dsw-alias-state-accent-primary); cursor: pointer; padding: 1px 3px; border-radius: 5px; }
  .crumb span { color: var(--dsw-alias-label-tertiary); }
  .files { max-height: 232px; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .frow { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; font-size: 12px;
    padding: 5px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--dsw-alias-label-primary); cursor: pointer; }
  .frow:hover { background: var(--dsw-alias-fill-l1); border-color: var(--dsw-alias-border-l1); }
  .frow svg { flex: 0 0 auto; color: var(--dsw-alias-label-tertiary); }
  .frow .fn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .fx { margin-left: auto; font-size: 10.5px; color: var(--dsw-alias-label-tertiary); flex: 0 0 auto; }
  .frow.dim { color: var(--dsw-alias-label-tertiary); cursor: default; }
  .frow.dim:hover { background: transparent; border-color: transparent; }

  /* 探查结果 */
  .probe { display: grid; gap: 10px; }
  .psum { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
  .pm { border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--r-s); padding: 7px 10px; background: var(--dsw-alias-fill-l1); }
  .pm b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.02em; color: var(--dsw-alias-state-accent-primary); }
  .pm span { font-size: 10.5px; color: var(--dsw-alias-label-tertiary); }
  .cols { width: 100%; border-collapse: collapse; font-size: 12px; }
  .cols th { text-align: left; font-weight: 600; font-size: 11px; color: var(--dsw-alias-label-secondary);
    border-bottom: 1px solid var(--dsw-alias-border-l1); padding: 6px 8px; position: sticky; top: 0; background: var(--dsw-alias-fill-l1); z-index: 1; }
  .cols td { padding: 6px 8px; border-bottom: 1px solid color-mix(in srgb, var(--dsw-alias-border-l1) 62%, transparent); vertical-align: top; }
  .cols tr:hover td { background: var(--dsw-alias-fill-l2); }
  .cols .num { text-align: right; }
  .wrap { max-height: 340px; overflow: auto; border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--r-s); }
  .ty { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; border-radius: 6px; padding: 1px 6px; border: 1px solid currentColor; }
  .ty.int, .ty.num { color: var(--dsw-alias-state-accent-primary); }
  .ty.date { color: var(--ind); }
  .ty.bool { color: var(--dsw-alias-state-success); }
  .ty.text { color: var(--dsw-alias-label-tertiary); }
  .ty.empty { color: var(--dsw-alias-state-warning); }
  .mbar { width: 46px; height: 4px; border-radius: 999px; background: var(--dsw-alias-border-l1); overflow: hidden; display: inline-block; vertical-align: middle; }
  .mbar i { display: block; height: 100%; background: var(--dsw-alias-state-warning); }
  .pick { display: flex; gap: 4px; }
  .pk { font: inherit; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--dsw-alias-border-l1);
    background: transparent; color: var(--dsw-alias-label-tertiary); cursor: pointer; }
  .pk:hover { border-color: var(--dsw-alias-border-l2); color: var(--dsw-alias-label-primary); }
  .pk[aria-pressed="true"] { color: #fff; background: var(--dsw-alias-state-accent-primary); border-color: transparent; font-weight: 600; }
  html[data-theme="dark"] .pk[aria-pressed="true"] { color: #08192e; }
  .pk.m[aria-pressed="true"] { background: var(--ind); }
  html[data-theme="dark"] .pk.m[aria-pressed="true"] { color: #0b1020; }

  /* 骨架库 */
  .skgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
  .sk { border: 1px solid var(--dsw-alias-border-l1); border-radius: var(--r-m); background: var(--dsw-alias-fill-l1); padding: 11px 12px;
    display: flex; flex-direction: column; gap: 7px; cursor: pointer; transition: transform .18s var(--ease), border-color .18s var(--ease); }
  .sk:hover { transform: translateY(-1px); border-color: var(--dsw-alias-border-l2); }
  .sk[aria-pressed="true"] { border-color: color-mix(in srgb, var(--dsw-alias-state-accent-primary) 52%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--dsw-alias-state-accent-primary) 34%, transparent), var(--sh-card); }
  .sk .mini { height: 46px; color: var(--dsw-alias-state-accent-primary); opacity: .85; }
  .sk b { font-size: 13px; font-weight: 660; }
  .sk p { margin: 0; font-size: 11.5px; color: var(--dsw-alias-label-secondary); }
  .sk .needs { font-size: 10.5px; color: var(--dsw-alias-label-tertiary); }

  /* 表格 + 阈值编辑 */
  .thr { display: grid; gap: 6px; }
  .throw { display: grid; gap: 6px; grid-template-columns: 1.4fr .6fr .8fr .9fr auto; align-items: center; }
  .throw .dshell-input { padding: 4px 8px; font-size: 12px; }
  select.dshell-input { appearance: none; padding-right: 22px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 12px) calc(50% + 2px), calc(100% - 7px) calc(50% + 2px);
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  /* 弹层 */
  .pop { position: fixed; inset: 0; z-index: 60; background: rgba(10,30,60,.34); display: grid; place-items: center; padding: 18px;
    backdrop-filter: blur(2px); animation: in .18s var(--ease); }
  @keyframes in { from { opacity: 0 } to { opacity: 1 } }
  .popbox { width: min(1080px, 96vw); max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
    background: var(--dsw-alias-fill-l1); border: 1px solid var(--dsw-alias-border-l2); border-radius: var(--r-l); box-shadow: var(--sh-pop); }
  .popbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .popbar b { font-size: 13px; }
  .popbody { padding: 0; overflow: auto; flex: 1 1 auto; min-height: 0; }
  .pop iframe { width: 100%; height: 100%; min-height: 60vh; border: 0; display: block; background: var(--dsw-alias-fill-l2); }
  .xbtn { margin-left: auto; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 80; max-width: min(560px, 92vw);
    padding: 9px 16px; border-radius: 999px; font-size: 12.5px; color: var(--dsw-alias-label-primary);
    background: var(--dsw-alias-fill-l1); border: 1px solid var(--dsw-alias-border-l2); box-shadow: var(--sh-pop);
    animation: up .22s var(--ease); white-space: normal; }
  .toast.bad { border-color: color-mix(in srgb, var(--dsw-alias-state-danger) 50%, transparent); color: var(--dsw-alias-state-danger); }
  @keyframes up { from { opacity: 0; transform: translate(-50%, 10px) } to { opacity: 1; transform: translate(-50%, 0) } }
  .empty { text-align: center; padding: 26px 14px; color: var(--dsw-alias-label-secondary); font-size: 12.5px;
    border: 1px dashed var(--dsw-alias-border-l2); border-radius: var(--r-m); background: var(--dsw-alias-fill-l1); }
  .spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--dsw-alias-border-l2);
    border-top-color: var(--dsw-alias-state-accent-primary); animation: sp .7s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg) } }
  .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  .kv2 dt { color: var(--dsw-alias-label-secondary); }
  .kv2 dd { margin: 0; word-break: break-all; }
  code.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--dsw-alias-label-secondary);

/* ---------------- 基础工具 ---------------- */

function cleanName(s) { return String(s || "").trim().replace(/[/\\:*?"<>|\s]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "未命名看板"; }
function stamp() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()); }

function fmtBytes(n) { n = Number(n) || 0; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB"; return (n / 1073741824).toFixed(2) + " GB"; }
function fmtNum(n) { if (n == null || !isFinite(n)) return "—"; var a = Math.abs(n); if (a >= 1e9) return (n / 1e9).toFixed(2) + "B"; if (a >= 1e6) return (n / 1e6).toFixed(2) + "M"; if (a >= 1e4) return Math.round(n).toLocaleString("zh-CN"); if (a >= 100) return Math.round(n).toLocaleString("zh-CN"); return (Math.round(n * 1e4) / 1e4).toLocaleString("zh-CN"); }
function ago(t) { if (!t) return "—"; var d = Date.now() - new Date(t).getTime(); if (!isFinite(d)) return "—"; var m = Math.floor(d / 60000); if (m < 1) return "刚刚"; if (m < 60) return m + " 分钟前"; var h = Math.floor(m / 60); if (h < 24) return h + " 小时前"; var day = Math.floor(h / 24); return day + " 天前"; }
function lines(v) { return String(v || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
function uid(p) { return (p || "id") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

async function api(path, body) {

  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function listDir(abs) {

}
async function writeFile(rel, content) {

  return r;
}
async function ensureDir(rel) { try { await api("/api/worktable/mkdir", { path: absOf(rel) }); } catch (e) { } }
async function readText(rel) {
  var r = await fetch("/api/worktable/file?path=" + encodeURIComponent(absOf(rel)) + "&sessionId=", { cache: "no-store" });
  if (!r.ok) throw new Error("读不到 " + rel + "（HTTP " + r.status + "）");

}

}
async function readBytes(abs) {
  var r = await fetch("/api/worktable/file?path=" + encodeURIComponent(abs) + "&sessionId=", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);

}
async function headInfo(abs) {  /* 文件是否存在 + 大小（站点接口回 404 表示不存在） */

    if (!r.ok) return { exists: false, size: 0 };
    var cl = r.headers.get("content-length");
    return { exists: true, size: cl ? Number(cl) : 0 };
  } catch (e) { return { exists: false, size: 0 }; }
}

/* ---------------- 宿主桥（iframe 同源，逐层往上找） ---------------- */
function hosts() {
  var out = [], w = null;
  try { w = window; } catch (e) { return out; }
  for (var i = 0; i < 6 && w; i++) {
    if (out.indexOf(w) >= 0) break;
    out.push(w);
    try { if (w === w.parent) break; w = w.parent; } catch (e) { break; }
  }
  try { if (window.top && out.indexOf(window.top) < 0) out.push(window.top); } catch (e) { }
  return out;
}
function hostGet(key) {
  var hs = hosts();
  for (var i = 0; i < hs.length; i++) { try { if (hs[i][key]) return hs[i][key]; } catch (e) { } }
  return null;
}
function sidOf(r) { return typeof r === "string" ? r : ((r && (r.sessionId || r.id)) || ""); }
async function createSessionInWorkspace(ss, ws, cwd) {
  if (typeof ss.using !== "function" || !ws) {
    var r0 = await ss.create({ cwd: cwd });
    var id0 = sidOf(r0);
    if (id0) return { sessionId: id0, via: "直接建会话" };
  }
  var w = null;
  try { w = cwd ? await ws.create({ path: cwd }) : await ws.initializeDefault(); } catch (e) { w = null; }
  var wid = w && w.workspaceId;
  if (typeof wid !== "string" || !wid) throw new Error("拿不到工作区 id（__dshWorkspaces 不可用）");
  var r1 = await ss.create({ workspaceId: wid });
  var id1 = sidOf(r1);
  if (!id1) throw new Error("sessions.create 没返回会话 id");
  return { sessionId: id1, via: "工作区 " + wid.slice(0, 8) + "…" };
}
async function newBuildSession(text) {
  var ss = hostGet("__dshSessions"), pr = hostGet("__dshPromptIntoSession"), op = hostGet("__dshOpenSession"), ws = hostGet("__dshWorkspaces");
  if (!ss || typeof ss.create !== "function" || typeof pr !== "function") {
    return { ok: false, msg: "没拿到宿主会话接口（__dshSessions.create / __dshPromptIntoSession）" };
  }
  try {
    var made = await createSessionInWorkspace(ss, ws, APP.ROOT);
    var sid = made.sessionId;
    await pr(sid, text);
    try { if (op) await op(sid); } catch (e) { }
    return { ok: true, sessionId: sid, via: made.via };
  } catch (e2) { return { ok: false, msg: "建会话失败：" + String((e2 && e2.message) || e2) }; }
}

/* ---------------- 闸门（口径 = 工具/qa-gate-data.mjs） ----------------
   可打开 = 产物在 + 数据源接得上 + 自检包齐（检查物/空态+窄屏两图/结果.json pass/README） */
async function gateOf(row) {
  var miss = [];
  var dir = String(row.file || "").replace(/[^/]*$/, "");
  var fname = String(row.file || "").split("/").pop();
  var board = await headInfo(absOf(row.file));
  if (!board.exists) return { status: "制作中", missing: ["产物还没写出来"], shots: 0 };
  var out = { status: "", missing: miss, shots: 0 };
  /* 1. 数据源必须还在（看板不接数据就没有存在意义） */
  var src = row.source && row.source.abs ? row.source.abs : (row.source && row.source.path ? absOf(row.source.path) : "");
  if (src) { var s = await headInfo(src); if (!s.exists) miss.push("数据源已不在：" + src); }
  else miss.push("台账没记数据源路径");
  /* 2. 产物里要真读了那个数据源文件名 */
  try {
    var html = await readText(row.file);
    var want = src ? src.split("/").pop() : "";
    if (want && html.indexOf(want) < 0) miss.push("产物里找不到数据源「" + want + "」的读取口径");
    if (html.indexOf("/api/worktable/template/dshell.css") < 0) miss.push("没引工作台皮肤");
    /* 皮肤自带回退是深色（#0b0e14 系）：不重定义变量就会做成黑底看板，实测踩过 */
    if (html.indexOf("--dsw-alias-bg-base") < 0) miss.push("没重定义皮肤变量（会跟随皮肤默认深色底，违反浅色科技蓝基线）");
  } catch (e) { miss.push("产物读不出来"); }
  /* 3. 自检包 */
  var selfDir = dir + "自检";   /* 产物在 数据看板/<名>/<名>.html → 自检在同级 */
  var alt = dir + row.name + "/自检";
  var listed = null;
  for (var cand of [selfDir, alt]) {
    try { var rr = await listDir(absOf(cand)); if (rr.entries && rr.entries.length) { listed = rr.entries; selfDir = cand; break; } } catch (e) { }
  }
  if (!listed) { miss.push("自检目录（" + selfDir + "）"); return finishGate(out); }
  var names = listed.map(function (e) { return e.name; });
  var hasCheck = names.some(function (f) { return /\.(mjs|js)$/i.test(f) || /冒烟|smoke/i.test(f); });
  if (!hasCheck) miss.push("可重放检查物（check.mjs 或冒烟页）");
  var pngs = names.filter(function (f) { return /\.png$/i.test(f); });
  if (pngs.length < APP.GATE_SHOT_MIN) miss.push("渲染图 ≥" + APP.GATE_SHOT_MIN + " 张（现在 " + pngs.length + "）");
  var hasReadme = names.some(function (f) { return /^README/i.test(f) || /说明\.md$/i.test(f); });
  if (!hasReadme) miss.push("一句话说明 README");
  /* 4. 文件名不算证据：必须读 结果.json */
  var res = null;
  try { res = JSON.parse(await readText(selfDir + "/结果.json")); } catch (e) { }
  out.shots = (res && res.shots) || pngs.length;
  if (!res) miss.push("自检/结果.json（由 check 产出）");
  else {
    if (res.pass !== true) miss.push("结果.json 里 pass 不为 true");
    var views = Array.isArray(res.views) ? res.views.join(",") : "";
    if (!APP.GATE_EMPTY.test(views)) miss.push("结果.json 的 views 里没有「空态」");
    if (!APP.GATE_NARROW.test(views)) miss.push("结果.json 的 views 里没有「窄屏」");
    if (!(Number(res.shots) >= APP.GATE_SHOT_MIN)) miss.push("结果.json 的 shots < " + APP.GATE_SHOT_MIN);
  }
  return finishGate(out);
  function finishGate(o) { o.status = o.missing.length ? "待验收" : "可打开"; return o; }
}
async function runGates() {
  state.busy = state.boards.length > 0 ? "gate" : "";
  render();
  var by = {};
  for (var i = 0; i < state.boards.length; i++) {
    var b = state.boards[i];
    if (!b) continue;
    try { by[b.id] = await gateOf(b); } catch (e) { by[b.id] = { status: b.status || "制作中", missing: ["状态检查失败：" + e.message], shots: 0 }; }
  }
  state.gateBy = by;
  state.busy = "";
  render();
  return by;
}

var DATA_EXT = ["csv", "tsv", "txt", "json", "jsonl", "ndjson", "md", "markdown", "xlsx", "xlsm"];

async function browseTo(path) {
  state.browse = { path: path, entries: [], err: "", loading: true };
  render();
  var r;
  try { r = await listDir(path); }
  catch (e) { state.browse.loading = false; state.browse.err = "读不到这个目录：" + (e.message || String(e)); render(); return; }
  var ents = (r.entries || []).filter(function (e) { return !e.hidden || e.name === ".dsh-worktable"; });
  state.browse.entries = ents;
  state.browse.loading = false;
  render();
}
async function probeFile(abs, name, sheet) {
  state.probe = { abs: abs, name: name, loading: true, ok: false, sheet: sheet || "" };
  render();
  var t0 = Date.now();
  try {
    var u8 = await readBytes(abs);
    var res = WT_DATA.parse(u8, { name: name, sheet: sheet || undefined, maxRows: 8000 });
    res.timeMs = Date.now() - t0;
    res.bytes = u8.length;
    if (!res.ok) { state.probe = { abs: abs, name: name, ok: false, error: res.error, format: res.format, sheet: sheet || "", bytes: u8.length }; }
    else { state.probe = { abs: abs, name: name, ok: true, res: res, sheet: sheet || (res.sheetNames && res.sheetNames[0]) || "" }; }
  } catch (e) {
    state.probe = { abs: abs, name: name, ok: false, error: (e && e.message) || String(e), sheet: sheet || "" };
  }
  /* 探查成功就把它接到向导上，并按列类型给出默认维度/度量 */
  if (state.probe.ok) {
    var f = state.form;
    f.source = { abs: abs, rel: relOf(abs), name: name, size: state.probe.res.bytes, format: state.probe.res.formatLabel,
      rows: state.probe.res.rowCount, cols: state.probe.res.columns.length };
    var dateCols = state.probe.res.columns.filter(function (c) { return c.type === "date"; });
    var numCols = state.probe.res.columns.filter(function (c) { return c.type === "int" || c.type === "num"; });
    var txtCols = state.probe.res.columns.filter(function (c) { return c.type === "text" || c.type === "bool"; });
    f.use.time = dateCols.length ? dateCols[0].name : "";
    f.use.measures = numCols.slice(0, 2).map(function (c) { return c.name; });
    f.use.dims = txtCols.slice(0, 2).map(function (c) { return c.name; });
    f.use.id = (txtCols[0] || {}).name || "";
    if (!f.skeletons.length) f.skeletons = numCols.length ? ["kpi", "trend"] : ["table"];
    upsertSource(f.source, state.probe.res);
  }
  render();
}
function relOf(abs) { return String(abs).indexOf(APP.ROOT + "/") === 0 ? String(abs).slice(APP.ROOT.length + 1) : String(abs); }

/* 登记到数据源台账（同路径覆盖，不堆重复条目） */
async function upsertSource(src, res) {
  var i = -1;
  for (var k = 0; k < state.sources.length; k++) if (state.sources[k] && state.sources[k].abs === src.abs) { i = k; break; }
  var row = {
    id: i >= 0 ? state.sources[i].id : uid("DS"),
    name: src.name, abs: src.abs, rel: src.rel, format: src.format,
    rows: res.rowCount, cols: res.columns.length, bytes: res.bytes || 0,
    sheet: src.sheet || "", probedAt: iso(),
    caliber: i >= 0 ? (state.sources[i].caliber || "") : "",
    colTypes: res.columns.reduce(function (o, c) { o[c.name] = c.type; return o; }, {})
  };
  if (i >= 0) state.sources[i] = row; else state.sources.unshift(row);
  try { await saveSources(); } catch (e) { toast("数据源台账写不进去：" + e.message, true); }
}

function saveFormDraft() {
  try { localStorage.setItem(APP.LS_FORM, JSON.stringify({ form: state.form, at: Date.now() })); } catch (e) { }
}
function loadFormDraft() {
  try {
    var raw = localStorage.getItem(APP.LS_FORM);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || !o.form || !o.form.name) return null;
    var f = blankForm();
    for (var k in o.form) if (Object.prototype.hasOwnProperty.call(f, k)) f[k] = o.form[k];
    if (!f.use) f.use = { time: "", dims: [], measures: [], id: "" };
    if (!f.thresholds) f.thresholds = [];
    if (!f.skeletons) f.skeletons = [];
    return f;
  } catch (e) { return null; }
}
function gotoStep(id) { state.form.step = id; saveFormDraft(); render(); }
function nextStep() {
  var i = stepIndex(state.form.step);
  if (i < STEPS.length - 1) gotoStep(STEPS[i + 1].id);
}
function prevStep() {
  var i = stepIndex(state.form.step);
  if (i > 0) gotoStep(STEPS[i - 1].id);
}
function toggleArr(arr, v) { var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function probeCols() { return state.probe && state.probe.ok ? state.probe.res.columns : []; }
function sortedProbeCols() {
  var cs = probeCols().slice(), key = state.probeSort;
  if (key === "missing") cs.sort(function (a, b) { return b.missingPct - a.missingPct; });
  else if (key === "distinct") cs.sort(function (a, b) { return b.distinct - a.distinct; });
  else if (key === "type") cs.sort(function (a, b) { return String(a.type).localeCompare(String(b.type)) || a.name.localeCompare(b.name, "zh"); });
  else cs.sort(function (a, b) { return a.index - b.index; });
  return cs.filter(function (c) {
    if (state.colFilter === "all") return true;
    if (state.colFilter === "num") return c.type === "int" || c.type === "num";
    if (state.colFilter === "date") return c.type === "date";
    if (state.colFilter === "text") return c.type === "text" || c.type === "bool";
    return true;
  });
}
function addThreshold() {
  var num = probeCols().filter(function (c) { return c.type === "int" || c.type === "num"; });
  state.form.thresholds.push({ col: num.length ? num[0].name : "", op: ">", value: "", level: "warn", note: "" });
  render();
}

function probeSummaryText() {
  if (!(state.probe && state.probe.ok)) return "（未探查）";
  var r = state.probe.res, p = state.probe;
  var numCols = r.columns.filter(function (c) { return c.type === "int" || c.type === "num"; });
  var dateCols = r.columns.filter(function (c) { return c.type === "date"; });
  var missWorst = r.columns.slice().sort(function (a, b) { return b.missingPct - a.missingPct; })[0];
  var L = [];
  L.push("- 文件：" + p.abs + "（" + fmtBytes(r.bytes) + "）");
  L.push("- 格式：" + r.formatLabel + (r.sep ? "，分隔符 " + (r.sep === "\t" ? "Tab" : JSON.stringify(r.sep)) : "") +
    (r.rootPath ? "，取数路径 " + r.rootPath : "") + (r.sheetNames && r.sheetNames.length > 1 ? "，工作表 " + r.sheetNames.join("、") + "（当前 " + p.sheet + "）" : ""));
  L.push("- 规模：" + r.rowCount + " 行 × " + r.columns.length + " 列" + (r.truncated ? "（已截断到 " + WT_DATA.MAX_ROWS + " 行，做图要么抽样要么分表）" : ""));
  if (dateCols.length) L.push("- 日期列：" + dateCols.map(function (c) { return c.name + "（" + c.dateMin + " ~ " + c.dateMax + "）"; }).join("、"));
  if (numCols.length) L.push("- 数值列：" + numCols.slice(0, 8).map(function (c) { return c.name + "（合计 " + fmtNum(c.sum) + "，均值 " + fmtNum(c.mean) + "，区间 " + fmtNum(c.min) + "~" + fmtNum(c.max) + "）"; }).join("、") + (numCols.length > 8 ? "，共 " + numCols.length + " 个" : ""));
  if (missWorst && missWorst.missingPct > 0) L.push("- 缺失最重的列：" + missWorst.name + " 缺 " + missWorst.missing + " 个（" + missWorst.missingPct + "%）—— 口径里要写清缺了算 0 还是跳过");
  L.push("- 全部列（名 · 类型 · 唯一值数 · 缺失率）：");
  r.columns.forEach(function (c) { L.push("  - " + c.name + " · " + c.type + " · " + c.distinct + " · " + c.missingPct + "%" + (c.samples && c.samples.length ? " · 例：" + c.samples.slice(0, 3).join(" / ") : "")); });

async function startBuild() {
  var f = state.form;
  /* 校验：逐个缺失项报出来，不做静默失败 */
  var bad = [];
  if (!String(f.name || "").trim()) bad.push("看板名称");
  if (!String(f.one || "").trim()) bad.push("一句话定位");
  if (!String(f.audience || "").trim()) bad.push("给谁看");
  if (!lines(f.question).length) bad.push("要回答的问题");
  if (!(f.source && f.source.abs)) bad.push("数据源");
  if (!(state.probe && state.probe.ok)) bad.push("数据源探查（换一个能解析的文件）");
  if (!(f.use.dims.length || f.use.measures.length || f.use.time)) bad.push("至少选一个维度或度量");
  if (!f.skeletons.length) bad.push("至少选一个看法");
  if (bad.length) { toast("还缺：" + bad.join("、"), true); gotoStep(bad[0].indexOf("数据源") >= 0 ? "src" : bad[0].indexOf("看法") >= 0 ? "form" : "pos"); return; }

  state.busy = "build"; render();
  var name = cleanName(f.name);
  var row = {
    id: "DB" + stamp() + "-" + name.slice(0, 8),
    name: name, file: APP.BOARD_DIR + "/" + name + "/" + name + ".html",
    desc: f.one, form: f.form, cadence: f.cadence,
    source: { abs: f.source.abs, rel: f.source.rel, name: f.source.name, format: f.source.format, rows: f.source.rows, cols: f.source.cols },
    shape: { time: f.use.time, dims: f.use.dims, measures: f.use.measures, id: f.use.id, thresholds: f.thresholds },
    skeletons: f.skeletons.slice(), theme: f.theme, autoref: f.autoref,
    at: iso(), status: "制作中", sessionId: "", plan: ""
  };
  try {
    await ensureDir(APP.BOARD_DIR);
    await ensureDir(APP.BOARD_DIR + "/" + name);
    await ensureDir(APP.PLAN_DIR);
    var planRel = APP.PLAN_DIR + "/方案书-" + stamp() + "-" + name + ".md";
    await writeFile(planRel, buildPlanText(row.file));
    row.plan = planRel;
    /* 同名的旧条目复用 id，避免台账堆一串 */
    var list = boardRows().slice();
    var i = list.findIndex(function (a) { return a && (a.file === row.file || (a.name === name && a.status === "制作中")); });
    if (i >= 0 && list[i].id !== row.id) row.id = list[i].id;
    if (i >= 0) list[i] = row; else list.unshift(row);
    state.boards = list;
    await saveBoards();
  } catch (e) {
    state.busy = ""; render();
    toast("准备失败：" + e.message, true);
    return;
  }
  var r = await newBuildSession(buildTaskText(row.plan, row));
  state.busy = "";
  if (r.ok) {
    row.sessionId = r.sessionId;
    try { await saveBoards(); } catch (e) { }
    startPoll();
    state.form = blankForm(); state.probe = null;
    try { localStorage.removeItem(APP.LS_FORM); } catch (e) { }
    state.tab = "boards"; render();
    toast("已新建会话制作「" + name + "」，做好并通过闸门后会变「可打开」");
  } else {
    var copied = await copyText(buildTaskText(row.plan, row));
    state.tab = "boards"; render();
    toast("自动开做没成（" + r.msg + "）" + (copied ? "；任务书已复制，粘到任意会话即可" : "；请到方案书页手动复制"), true);
  }
}
function startPoll() {
  clearInterval(state.pollTimer); state.pollN = 0;
  state.pollTimer = setInterval(async function () {
    if (++state.pollN > 240) { clearInterval(state.pollTimer); state.pollTimer = null; return; }
    var before = boardRows().map(function (a) { return a.status; }).join(",");
    await loadLedgers();
    await runGates();
    if (boardRows().map(function (a) { return a.status; }).join(",") !== before) {
      toast("台账状态已更新");
      if (!boardRows().some(function (a) { return statusOf(a) === "制作中"; })) { clearInterval(state.pollTimer); state.pollTimer = null; }
    }
  }, 5000);
}
function statusOf(row) {
  var g = state.gateBy[row.id];
  return g ? g.status : (row.status || "制作中");
}
function openPreview(row) {
  state.preview = { title: row.name, src: siteUrl(absOf(String(row.file).replace(/[^/]*$/, "")).replace(/\/+$/, ""), String(row.file).split("/").pop()) + "?v=" + Date.now(), row: row };
  render();
}

/* ================= 数据工作台 · 渲染 / 动作 / 启动 ================= */
function loadFormDraftCached() { return state.hasDraft; }

function modalHtml() {
  var out = "";
  if (state.preview) {
    var r = state.preview.row || {};
    out += '<div class="pop" data-act="closePrev" role="dialog" aria-modal="true" aria-label="看板预览"><div class="popbox" data-stop="1">' +
      '<div class="popbar">' +
      ic("board") + "<b>" + esc(state.preview.title) + "</b>" +
      '<span class="badge done" style="margin-left:8px"><i></i>预览</span>' +
      '<div class="bar-end xbtn">' +
      '<button class="dshell-btn dshell-btnGhost" data-act="openTab" data-arg="' + esc(r.id || "") + '">' + ic("open") + "新窗口</button>" +
      '<button class="dshell-btn dshell-btnGhost" data-act="sync" data-arg="' + esc(r.id || "") + '">' + ic("sync") + "同步</button>" +
      '<button class="dshell-btn" data-act="closePrev">' + ic("close") + "关闭</button>" +
      "</div></div>" +
      '<div class="popbody"><iframe src="' + esc(state.preview.src) + '" title="' + esc(state.preview.title) + ' 预览" loading="lazy"></iframe></div>' +
      "</div></div>";
  }
  if (state.confirming) {
    var c = state.confirming;
    out += '<div class="pop" data-act="cancelConf" role="dialog" aria-modal="true"><div class="popbox" style="width:min(460px,94vw)" data-stop="1">' +
      '<div class="popbar">' + ic("warn") + "<b>确认删除台账条目</b></div>" +
      '<div class="popbody" style="padding:14px 16px"><p class="dshell-sub" style="margin:0">' + esc(c.text) + "</p>" +
      '<p class="dshell-muted" style="margin:8px 0 0">只删台账里这一条记录，磁盘上的产物与自检文件不动（要清文件请自己在资源管理器里删）。</p></div>' +
      '<div class="popbar" style="border-top:1px solid var(--dsw-alias-border-l1);border-bottom:0">' +
      '<button class="dshell-btn dshell-btnGhost" data-act="cancelConf">取消</button>' +
      '<button class="dshell-btn dshell-btnDanger" data-act="doConf">删除</button></div></div></div>';
  }
  return out;
}
function render() {
  var fn = V[state.tab] || V.boards;
  var html = heroHtml() + tabsHtml() + '<section>' + fn() + "</section>";
  if (state.err) html += '<div class="miss">' + ic("warn") + " " + esc(state.err) + "</div>";
  html += modalHtml();
  if (state.toast) html += '<div class="toast' + (state.toast.bad ? " bad" : "") + '" role="status">' + esc(state.toast.msg) + "</div>";
  var app = document.getElementById("app");
  var ae = document.activeElement, aid = ae && ae.id ? ae.id : "";
  app.innerHTML = html;
  if (aid) { var back = document.getElementById(aid); if (back && back.focus) { try { back.focus(); } catch (e) { } } }
  document.body.classList.toggle("dark", state.theme === "dark");
}

/* ---------------- 动作分发 ---------------- */
function byId(id) { for (var i = 0; i < state.boards.length; i++) if (state.boards[i] && state.boards[i].id === id) return state.boards[i]; return null; }
async function act(name, arg, el) {
  var f = state.form;
  if (name === "tab") { state.tab = arg; try { localStorage.setItem(APP.LS_TAB, arg); } catch (e) { } render(); return; }
  if (name === "theme") {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = state.theme;
    try { localStorage.setItem(APP.LS_THEME, state.theme); } catch (e) { }
    render(); return;
  }
  if (name === "newBoard") { state.form = blankForm(); state.probe = null; state.tab = "wizard"; render(); browseTo(state.browse.path); return; }
  if (name === "step") { gotoStep(arg); return; }
  if (name === "nextStep") { nextStep(); return; }
  if (name === "prevStep") { prevStep(); return; }
  if (name === "set") { f[el.getAttribute("data-arg")] = el.getAttribute("data-val"); saveFormDraft(); render(); return; }
  if (name === "browse") { browseTo(arg); return; }
  if (name === "probe") { await probeFile(arg, String(arg).split("/").pop()); gotoStep("shape"); return; }
  if (name === "sheet") { if (state.probe && state.probe.abs) await probeFile(state.probe.abs, state.probe.name, arg); return; }
  if (name === "psort") { state.probeSort = arg; render(); return; }
  if (name === "pfilter") { state.colFilter = arg; render(); return; }
  if (name === "useT") { f.use.time = f.use.time === arg ? "" : arg; saveFormDraft(); render(); return; }
  if (name === "useI") { f.use.id = f.use.id === arg ? "" : arg; saveFormDraft(); render(); return; }
  if (name === "useD") { toggleArr(f.use.dims, arg); saveFormDraft(); render(); return; }
  if (name === "useM") { toggleArr(f.use.measures, arg); saveFormDraft(); render(); return; }
  if (name === "skel") { toggleArr(f.skeletons, arg); saveFormDraft(); render(); return; }
  if (name === "skelAll") { f.skeletons = []; saveFormDraft(); render(); return; }
  if (name === "addThr") { addThreshold(); saveFormDraft(); return; }
  if (name === "delThr") { f.thresholds.splice(Number(arg), 1); saveFormDraft(); render(); return; }
  if (name === "build") { await startBuild(); return; }
  if (name === "gate") { state.busy = "gate"; render(); await runGates(); state.busy = ""; toast("状态已按闸门口径重算"); return; }
  if (name === "prev") { var rw = byId(arg); if (rw) openPreview(rw); return; }
  if (name === "closePrev") { state.preview = null; render(); return; }
  if (name === "openTab") { var rw2 = byId(arg); if (rw2) { try { window.open(state.preview ? state.preview.src : siteUrl(absOf(String(rw2.file).replace(/[^/]*$/, "")), String(rw2.file).split("/").pop()), "_blank"); } catch (e) { toast("浏览器拦了新窗口", true); } } return; }
  if (name === "sync") { var rw3 = byId(arg); if (rw3) await syncBoard(rw3); return; }
  if (name === "rm") { var rw4 = byId(arg); if (rw4) { state.confirming = { kind: "board", id: arg, text: "从台账里移除「" + rw4.name + "」？" }; render(); } return; }
  if (name === "cancelConf") { state.confirming = null; render(); return; }
  if (name === "doConf") {
    var c = state.confirming; state.confirming = null;
    if (c && c.kind === "board") {
      state.boards = state.boards.filter(function (b) { return b && b.id !== c.id; });
      try { await saveBoards(); } catch (e) { toast("台账写不回去：" + e.message, true); }
      toast("已从台账移除");
    } else if (c && c.kind === "source") {
      state.sources.splice(Number(c.i), 1);
      try { await saveSources(); } catch (e) { toast("数据源台账写不回去：" + e.message, true); }
      toast("已取消登记");
    }
    render(); return;
  }
  if (name === "copyPlan") { var rw5 = byId(arg); if (!rw5 || !rw5.plan) return; try { var t = await readText(rw5.plan); var okc = await copyText(t); toast(okc ? "方案书已复制" : "复制失败，内容在浏览器控制台", !okc); if (!okc) console.log(t); } catch (e) { toast("读不到方案书：" + e.message, true); } return; }
  if (name === "copyTask") {
    var rw6 = byId(arg); if (!rw6) return;
    var saved = state.form;
    try {
      state.form = Object.assign(blankForm(), { name: rw6.name, one: rw6.desc || "", audience: "-", question: "", form: rw6.form || "单文件看板", cadence: rw6.cadence || "每次打开现算", source: rw6.source, use: rw6.shape || { time: "", dims: [], measures: [], id: "" }, skeletons: rw6.skeletons || [], thresholds: (rw6.shape && rw6.shape.thresholds) || [] });
      var txt = buildTaskText(rw6.plan || "", rw6);
      var ok2 = await copyText(txt);
      toast(ok2 ? "任务书已复制，粘到任意会话即可重做这块看板" : "复制失败，内容在浏览器控制台", !ok2);
      if (!ok2) console.log(txt);
    } finally { state.form = saved; }
    return;
  }
  if (name === "copyPlanDraft") {
    var txt2 = buildPlanText(APP.BOARD_DIR + "/" + cleanName(f.name) + "/" + cleanName(f.name) + ".html");
    var ok3 = await copyText(txt2);
    toast(ok3 ? "方案书已复制（还没落盘）" : "方案书内容在浏览器控制台", !ok3);
    if (!ok3) console.log(txt2);
    return;
  }
  if (name === "reprobe") { var s = state.sources[Number(arg)]; if (s) { await probeFile(s.abs, s.name, s.sheet || undefined); toast("已重探：" + s.name); } return; }
  if (name === "delSource") { state.confirming = { kind: "source", i: Number(arg), text: "取消登记「" + (state.sources[Number(arg)] || {}).name + "」？" }; render(); return; }
  if (name === "clearDraft") { try { localStorage.removeItem(APP.LS_FORM); } catch (e) { } state.form = blankForm(); state.probe = null; state.hasDraft = false; render(); toast("草稿已清空"); return; }
  if (name === "export") {
    var pack = JSON.stringify({ exportedAt: iso(), boards: state.boards, sources: state.sources }, null, 2);
    var ok4 = await copyText(pack);
    if (!ok4) { try { await writeFile(APP.SELF_DIR + "/台账导出-" + stamp() + ".json", pack); toast("剪贴板不可用，已写到项目文件", true); } catch (e) { toast("复制和写盘都不成", true); } }
    else toast("台账 JSON 已复制");
    return;
  }
  if (name === "copyPatch") { var ok5 = await copyText(patchCmd()); toast(ok5 ? "打补丁命令已复制（含 --dry 先看命中）" : "命令：" + patchCmd(), !ok5); return; }
  if (name === "copyGuide") {
    var rw7 = boardRows()[0];
    var ok6 = await copyText(rw7 ? syncGuideText(rw7) : "在工作台左侧项目列表点「＋」添加项目，选目录后在窗口里选「自定义」。");
    toast(ok6 ? "建项目指引已复制" : "复制失败", !ok6); return;
  }
  if (name === "copySpec") {
    try {
      var spec = await readText(APP.SELF_DIR + "/工作台同步约定.md");
      var ok7 = await copyText(spec);
      toast(ok7 ? "共用约定已复制，转给另外三个工作台的会话即可" : "读不到约定文件", !ok7);
    } catch (e) { toast("读不到约定文件（还没生成？）", true); }
    return;
  }
}
function patchCmd() { return "node " + absOf(APP.SELF_DIR + "/工具/补丁-项目同步.mjs"); }

/* ---------------- 事件绑定（一次全量委托，重绘不掉监听） ---------------- */
function bindOnce() {
  var app = document.getElementById("app");
  app.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("[data-stop]")) { if (!e.target.closest("[data-act]")) return; }
    if (e.target.classList && e.target.classList.contains("pop")) { act(e.target.getAttribute("data-act")); return; }
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var n = el.getAttribute("data-act"), a = el.getAttribute("data-arg");
    if (el.disabled) return;
    e.preventDefault();
    act(n, a, el);
  });
  app.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.getAttribute("data-act") === "skel") {
      e.preventDefault(); act("skel", e.target.getAttribute("data-arg"), e.target);
    }
    if (e.key === "Escape") { if (state.preview) { state.preview = null; render(); } else if (state.confirming) { state.confirming = null; render(); } }
  });
  /* 文本类输入：只写状态，不整页重绘（保光标） */
  app.addEventListener("input", function (e) {
    var t = e.target;
    var k = t.getAttribute && t.getAttribute("data-k");
    if (k) { state.form[k] = t.value; state.hasDraft = true; debSave(); return; }
    var th = t.getAttribute && t.getAttribute("data-thr");
    if (th) { var pa = th.split(":"); var row = state.form.thresholds[Number(pa[0])]; if (row) { row[pa[1]] = t.value; debSave(); } return; }
    var sk = t.getAttribute && t.getAttribute("data-srck");
    if (sk) { var s = state.sources[Number(sk)]; if (s) { s.caliber = t.value; debSaveSrc(); } return; }
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    var th = t.getAttribute && t.getAttribute("data-thr");
    if (th && t.tagName === "SELECT") { var pa = th.split(":"); var row = state.form.thresholds[Number(pa[0])]; if (row) { row[pa[1]] = t.value; saveFormDraft(); } return; }
    var sk = t.getAttribute && t.getAttribute("data-srck");
    if (sk) { try { saveSources(); } catch (e2) { } return; }
  });
}
var _saveT = null; function debSave() { clearTimeout(_saveT); _saveT = setTimeout(function () { saveFormDraft(); }, 350); }
var _srcT = null; function debSaveSrc() { clearTimeout(_srcT); _srcT = setTimeout(function () { saveSources().catch(function () { }); }, 600); }

/* ---------------- 启动 ---------------- */
async function boot() {
  try { state.theme = localStorage.getItem(APP.LS_THEME) || "light"; } catch (e) { }
  document.documentElement.dataset.theme = state.theme;
  try { var tb = localStorage.getItem(APP.LS_TAB); if (tb && V[tb]) state.tab = tb; } catch (e) { }
  var draft = loadFormDraft();
  state.form = draft || blankForm();
  state.hasDraft = !!draft;
  bindOnce();
  render();
  try { await listDir(APP.ROOT); state.lights.fs = "ok"; } catch (e) { state.lights.fs = "bad"; state.err = "读不到项目根（" + APP.ROOT + "）：" + e.message; }
  try { await loadLedgers(); state.lights.ledger = "ok"; } catch (e) { state.lights.ledger = "bad"; state.err = "台账读不到：" + e.message; }
  if (draft && draft.source && draft.source.abs && state.tab === "wizard") {
    /* 草稿里有上次探过的文件：把探查结果捞回来，省得重选 */
    try { await probeFile(draft.source.abs, draft.source.name, draft.source.sheet || undefined); state.form.source = draft.source; state.form.use = draft.use; state.form.skeletons = draft.skeletons; } catch (e) { }
  }
  render();
  browseTo(state.browse.path);
  if (boardRows().length) await runGates();
  if (draft && draft.name) toast("已恢复上次没做完的向导草稿：" + draft.name);
}
if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}

</script>
