<!doctype html>
<!-- 应用工作台 · 窗口1 主页
     皮肤：dsh-worktable 官方皮肤 dshell.css；本文件只追加一层「科技苹果风」微调（细描边/大圆角/留白/线性图标）。
     产出物一律写进项目文件夹，接口全部同源：/api/worktable/fs | write | mkdir | file | site -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>应用工作台</title>
<link rel="stylesheet" href="/api/worktable/template/dshell.css" />
<style>
  /* —— 科技蓝 · 官网级视觉层 ——
     只重定义 dshell 皮肤变量 + 组件质感；图标仍是苹果线性规格；不引任何外部资源。 */
  :root {
    color-scheme: light;
    --dsw-alias-bg-base: #eaf1ff;
    --dsw-alias-fill-l1: #ffffff;
    --dsw-alias-border-l1: #d3e2fb;
    --dsw-alias-border-l2: #a9c8f5;
    --dsw-alias-label-primary: #0a1b33;
    --dsw-alias-label-secondary: #4b6285;
    --dsw-alias-label-tertiary: #54698a;
    --dsw-alias-state-accent-primary: #0a84ff;
    --dsw-alias-state-danger: #ff3b30;
    --wt-danger-text: #a01d15;
    --wt-ink: #06132a; --wt-ink-2: #1c3357;
    --wt-blue: #0a84ff; --wt-blue-d: #0060df; --wt-cyan: #5ac8fa; --wt-indigo: #5e5ce6; --wt-mint: #127a39;
    --wt-rad: 18px; --wt-rad-lg: 26px; --wt-rad-sm: 12px;
    --wt-hair: 1px solid var(--dsw-alias-border-l1, #d3e2fb);
    --wt-glass: saturate(190%) blur(22px);
    --wt-shadow-1: 0 1px 2px rgba(6,19,42,.05), 0 12px 28px -20px rgba(10,80,190,.38);
    --wt-shadow-2: 0 2px 6px rgba(6,19,42,.06), 0 34px 70px -34px rgba(10,80,190,.5);
    --wt-grad-brand: linear-gradient(94deg, #0a84ff 0%, #5ac8fa 46%, #5e5ce6 100%);
    --wt-ring: 0 0 0 4px rgba(10,132,255,.16);
    --wt-ease: cubic-bezier(.32,.72,0,1);
    --wt-ink-icon: #0a84ff;
  }
  html { background: #eaf1ff; }
  body {
    position: relative; min-height: 100vh; margin: 0;
    background: linear-gradient(180deg, #f4f8ff 0%, #e4eeff 100%);
    color: var(--dsw-alias-label-primary, #0a1b33);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 13px; -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
  }
  /* 品牌光雾 + 极淡网格（纯 CSS，无图片） */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1200px 620px at 84% -10%, rgba(10,132,255,.30), transparent 62%),
      radial-gradient(760px 420px at 4% 6%, rgba(90,200,250,.24), transparent 58%),
      radial-gradient(900px 560px at 46% 116%, rgba(94,92,230,.20), transparent 60%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background:
      linear-gradient(rgba(10,60,140,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,60,140,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(1100px 620px at 50% 0%, #000 20%, transparent 78%);
    mask-image: radial-gradient(1100px 620px at 50% 0%, #000 20%, transparent 78%);
  }
  .dshell { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 26px; padding: 30px 24px 44px; max-width: 1000px; margin: 0 auto; }
  /* —— 品牌区 / Hero —— */
  .wt-hero { position: relative; overflow: hidden; padding: 26px 28px 24px; border: var(--wt-hair); border-radius: var(--wt-rad-lg); background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.68)); -webkit-backdrop-filter: var(--wt-glass); backdrop-filter: var(--wt-glass); box-shadow: var(--wt-shadow-2); }
  .wt-hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9) 30%, rgba(255,255,255,.9) 70%, transparent); }
  .wt-hero::after { content: ""; position: absolute; right: -90px; top: -120px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(10,132,255,.22), transparent 62%); pointer-events: none; }
  .wt-brand { position: relative; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wt-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--wt-grad-brand); color: #fff; box-shadow: 0 8px 18px -10px rgba(10,132,255,.95); }
  .wt-mark .ic { color: #fff; font-size: 16px; }
  .wt-brandName { font-size: 13px; font-weight: 600; letter-spacing: -.012em; }
  .wt-pill { padding: 3px 10px; border-radius: 999px; border: var(--wt-hair); background: rgba(255,255,255,.7); font-size: 10.5px; font-weight: 500; color: var(--dsw-alias-label-secondary, #4b6285); font-variant-numeric: tabular-nums; }
  .wt-heroActions { display: flex; gap: 8px; margin-left: auto; }
  .wt-display { position: relative; margin: 20px 0 0; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -.035em; max-width: 22em; color: var(--wt-ink); }
  .wt-display em { font-style: normal; color: var(--wt-blue); }
  .wt-lead { position: relative; margin: 12px 0 0; max-width: 62ch; font-size: 13.5px; line-height: 1.7; color: var(--dsw-alias-label-secondary, #4b6285); }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .wt-display em { background: var(--wt-grad-brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  }
  /* 分段统计条（官网常见的 stat bar） */
  .wt-stats { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); margin-top: 24px; border: var(--wt-hair); border-radius: 16px; overflow: hidden; background: var(--dsw-alias-border-l1, #d3e2fb); gap: 1px; }
  .wt-stats .dshell-stat { border: none; border-radius: 0; box-shadow: none; background: rgba(255,255,255,.9); padding: 12px 14px; }
  .wt-stats .dshell-statLabel { font-size: 10.5px; letter-spacing: .04em; color: var(--dsw-alias-label-tertiary, #54698a); }
  .wt-stats .dshell-statValue { margin-top: 2px; font-size: 24px; color: var(--wt-blue); }
  .wt-stats .dshell-statValue[data-plain="true"] { font-size: 13px; letter-spacing: -.01em; color: var(--dsw-alias-label-primary, #0a1b33); }
  /* —— 章节 —— */
  .wt-sec { display: flex; flex-direction: column; gap: 12px; }
  .wt-eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--wt-blue); }
  .wt-h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.024em; color: var(--wt-ink); }
  .wt-secHead { display: flex; flex-direction: column; gap: 3px; }
  .wt-secHead .dshell-muted { font-size: 12px; }
  /* —— 卡片与列表 —— */
  .dshell-card, .dshell-listItem { border-radius: var(--wt-rad); border: var(--wt-hair); box-shadow: var(--wt-shadow-1); }
  .dshell-card { position: relative; padding: 18px 20px; background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.76)); -webkit-backdrop-filter: var(--wt-glass); backdrop-filter: var(--wt-glass); }
  .dshell-listItem { background: rgba(255,255,255,.86); transition: background .18s var(--wt-ease), border-color .18s var(--wt-ease), transform .18s var(--wt-ease), box-shadow .18s var(--wt-ease); }
  .dshell-listItem:hover { background: #fff; border-color: var(--wt-blue); transform: translateY(-1px); box-shadow: 0 1px 2px rgba(6,19,42,.05), 0 16px 30px -22px rgba(10,80,190,.5); }
  .dshell-listItem:hover .dshell-listItemMeta { color: var(--wt-blue-d); }
  .dshell-listItem a { text-decoration: none; }
  .dshell-listItem a:hover { text-decoration: underline; }
  /* —— 分段控件 —— */
  .dshell-tabs { display: inline-flex; gap: 2px; width: fit-content; max-width: 100%; overflow-x: auto; padding: 3px; border: var(--wt-hair); border-radius: 999px; background: rgba(10,132,255,.12); box-shadow: inset 0 1px 2px rgba(6,19,42,.06); }
  .dshell-tab { border: none; border-bottom: none; margin: 0; padding: 7px 15px; border-radius: 999px; font-size: 12.5px; color: var(--dsw-alias-label-secondary, #4b6285); white-space: nowrap; transition: background .18s var(--wt-ease), color .18s var(--wt-ease), box-shadow .18s var(--wt-ease); }
  .dshell-tab:hover { color: var(--wt-ink); }
  .dshell-tabOn { background: #fff; color: var(--wt-blue-d); box-shadow: 0 1px 3px rgba(10,80,190,.24); border-bottom: none; }
  .dshell-tabOn .ic { color: var(--wt-blue); }
  /* —— 按钮 —— */
  .dshell-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 7px 16px; border-radius: 999px; border: 1px solid transparent; background: #0060df; color: #fff; font: inherit; font-size: 12.5px; font-weight: 500; letter-spacing: -.01em; cursor: pointer; box-shadow: 0 8px 20px -10px rgba(10,132,255,.85); transition: filter .18s var(--wt-ease), transform .18s var(--wt-ease), box-shadow .18s var(--wt-ease); }
  .dshell-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 12px 26px -10px rgba(0,96,223,.85); }
  .dshell-btn:active { transform: translateY(0) scale(.98); }
  .dshell-btn .ic { color: #fff; }
  .dshell-btnGhost { background: rgba(255,255,255,.9); border: var(--wt-hair); color: var(--dsw-alias-label-secondary, #4b6285); box-shadow: none; }
  .dshell-btnGhost:hover { color: var(--wt-blue-d); border-color: var(--wt-blue); background: #fff; box-shadow: none; }
  .dshell-btnGhost .ic { color: inherit; }
  .dshell-btnGhost[data-on="true"] { color: var(--wt-blue-d); border-color: var(--wt-blue); background: rgba(10,132,255,.1); }
  .dshell-btnDanger { background: transparent; border-color: var(--dsw-alias-state-danger, #ff3b30); color: var(--wt-danger-text, #a01d15); box-shadow: none; }
  /* —— 输入 —— */
  .dshell-input, .dshell-textarea { width: 100%; padding: 9px 12px; border: var(--wt-hair); border-radius: var(--wt-rad-sm); background: rgba(255,255,255,.94); color: var(--dsw-alias-label-primary, #0a1b33); font: inherit; font-size: 12.5px; outline: none; transition: border-color .18s var(--wt-ease), box-shadow .18s var(--wt-ease); }
  .dshell-input::placeholder, .dshell-textarea::placeholder { color: var(--dsw-alias-label-tertiary, #54698a); }
  .dshell-input:focus, .dshell-textarea:focus { border-color: var(--wt-blue); box-shadow: var(--wt-ring); }
  /* —— 徽标 / 进度 / 其它 —— */
  .dshell-badge { border-radius: 999px; }
  .dshell-badgeDone { color: var(--wt-mint); border-color: rgba(26,158,75,.34); }
  .dshell-badgeDone::before { background: var(--wt-mint); box-shadow: none; }
  .dshell-badgeWait { color: #9a5b00; border-color: rgba(255,159,10,.42); }
  .dshell-badgeWait::before { background: #ff9f0a; box-shadow: none; }
  .dshell-progress { height: 4px; border-radius: 2px; background: rgba(10,132,255,.16); overflow: hidden; }
  .dshell-progressBar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #0a84ff, #5ac8fa); transition: width .32s var(--wt-ease); }
  .dshell-table th, .dshell-table td { border-color: var(--dsw-alias-border-l1, #d3e2fb); }
  .wt-ledWrap { overflow-x: auto; }
  .wt-led { width: 100%; border-collapse: collapse; }
  .wt-led th { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-align: left; white-space: nowrap; color: var(--dsw-alias-label-tertiary, #54698a); }
  .wt-led td { font-size: 12px; text-align: left; vertical-align: middle; }
  .wt-led td:nth-child(1), .wt-led td:nth-child(2), .wt-led td:nth-child(5), .wt-led td:nth-child(7) { white-space: nowrap; }
  .wt-led td:nth-child(3) { min-width: 7em; }
  .wt-led td:nth-child(6) { min-width: 6em; }
  .wt-led td:last-child .wt-row { flex-wrap: nowrap; }
  .wt-led tbody tr:hover td { background: rgba(255,255,255,.72); }
  .wt-led td a { color: var(--wt-blue-d, #0060df); text-decoration: none; }
  .wt-led td a:hover { text-decoration: underline; }
  .wt-led td code { font-size: 11px; color: var(--dsw-alias-label-secondary, #4b6285); word-break: break-all; }
  .dshell-divider { background: linear-gradient(90deg, var(--dsw-alias-border-l2, #a9c8f5), transparent); }
  .dshell-muted { font-size: 11.5px; color: var(--dsw-alias-label-tertiary, #8aa2c4); }
  .dshell-sub { font-size: 12.5px; color: var(--dsw-alias-label-secondary, #4b6285); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(10,80,180,.24); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .dshell-tab:focus:not(:focus-visible), .dshell-btn:focus:not(:focus-visible) { outline: none; }
  :focus-visible { outline: 2px solid var(--wt-blue); outline-offset: 2px; }
  /* —— 线性图标：16×16、描边 1、圆角 2.8、内缩 14% —— */
  .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -.14em; flex: none; color: var(--wt-ink-icon); }
  /* —— 向导 —— */
  .wt-steps { position: relative; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: var(--wt-hair); }
  .wt-step { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 2px 5px; margin: -2px -5px; border: none; background: none; font: inherit; font-size: 11.5px; color: var(--dsw-alias-label-tertiary, #54698a); cursor: pointer; border-radius: 7px; transition: color .18s var(--wt-ease), background .18s var(--wt-ease); }
  .wt-step:hover { color: var(--dsw-alias-label-primary, #0a1b33); background: rgba(10,132,255,.08); }
  .wt-step:focus-visible { outline: 2px solid var(--wt-blue); outline-offset: 2px; }
  .wt-step[data-on="true"] { color: var(--wt-ink); font-weight: 500; }
  .wt-step i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; border: var(--wt-hair); display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; background: rgba(255,255,255,.9); transition: background .18s var(--wt-ease), color .18s var(--wt-ease), box-shadow .18s var(--wt-ease); }
  .wt-step[data-on="true"] i { background: var(--wt-blue-d); border-color: var(--wt-blue-d); color: #fff; box-shadow: 0 0 0 4px rgba(10,132,255,.16); }
  .wt-step[data-done="true"] i { background: rgba(10,132,255,.14); border-color: var(--wt-blue); color: var(--wt-blue-d); }
  .wt-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .wt-field > label { font-size: 11.5px; font-weight: 500; color: var(--dsw-alias-label-secondary, #4b6285); display: flex; gap: 5px; align-items: center; }
  .wt-field .req { color: var(--wt-danger-text, #a01d15); }
  .wt-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .wt-err { font-size: 11.5px; color: var(--wt-danger-text, #a01d15); min-height: 16px; }
  .wt-nav { display: flex; gap: 8px; align-items: center; margin-top: 4px; padding-top: 14px; border-top: var(--wt-hair); }
  .wt-nav .sp { flex: 1; }
  .wt-out { display: flex; flex-direction: column; gap: 10px; }
  .wt-out code { font-size: 11px; color: var(--dsw-alias-label-secondary, #4b6285); word-break: break-all; }
  .wt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .wt-aiMask { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 20px; background: rgba(10,27,51,.28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .wt-aiCard { width: min(560px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: var(--wt-rad-lg); border: var(--wt-hair); background: #fff; box-shadow: var(--wt-shadow-2); }
  .wt-aiCard h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
  .wt-aiCard .dshell-muted { margin-top: -6px; }
  .wt-aiRow { display: flex; gap: 8px; justify-content: flex-end; }
  .wt-aiHint { font-size: 11.5px; color: var(--dsw-alias-label-secondary, #4b6285); }
  /* 我的应用 */
  .wt-apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .wt-app { display: flex; flex-direction: column; gap: 5px; padding: 13px 14px; border: var(--wt-hair); border-radius: var(--wt-rad); background: rgba(255,255,255,.86); text-align: left; font: inherit; cursor: pointer; transition: border-color .18s var(--wt-ease), transform .18s var(--wt-ease), box-shadow .18s var(--wt-ease); }
  .wt-app:hover { border-color: var(--wt-blue); transform: translateY(-1px); box-shadow: var(--wt-shadow-1); }
  .wt-app b { font-size: 12.5px; font-weight: 600; letter-spacing: -.01em; }
  .wt-app span { font-size: 11px; color: var(--dsw-alias-label-secondary, #4b6285); }
  .wt-app[data-busy="true"] { opacity: .82; }
  .wt-app[data-busy="true"]:hover { border-color: var(--dsw-alias-border-l2, #a9c8f5); }
  .wt-appIco { font-size: 17px; }
  .wt-appMiss { font-size: 10.5px; color: #9a5b00; }
  /* 全屏打开应用 */
  .wt-menu { position: absolute; right: 24px; top: 74px; z-index: 40; display: flex; flex-direction: column; gap: 2px; padding: 6px; border: var(--wt-hair); border-radius: 14px; background: rgba(255,255,255,.96); -webkit-backdrop-filter: var(--wt-glass); backdrop-filter: var(--wt-glass); box-shadow: var(--wt-shadow-2); }
  .wt-menuItem { border: none; background: none; font: inherit; font-size: 12px; text-align: left; padding: 7px 10px; border-radius: 9px; cursor: pointer; color: var(--dsw-alias-label-primary, #0a1b33); }
  .wt-menuItem:hover { background: rgba(10,132,255,.09); color: var(--wt-blue-d, #0060df); }
  .wt-menuVer { font-size: 10px; color: var(--dsw-alias-label-tertiary, #54698a); padding: 4px 10px; font-variant-numeric: tabular-nums; }
  .dshell-listItem .dshell-listItemMeta { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .wt-recSearch { flex: 1; min-width: 140px; max-width: 260px; }
  .wt-chips { display: inline-flex; gap: 2px; padding: 3px; border: var(--wt-hair); border-radius: 999px; background: rgba(10,132,255,.1); }
  .wt-chips .dshell-btn { border: none; background: none; box-shadow: none; padding: 4px 11px; font-size: 11.5px; color: var(--dsw-alias-label-secondary, #4b6285); font-variant-numeric: tabular-nums; }
  .wt-chips .dshell-btn[data-on="true"] { background: #fff; color: var(--wt-blue-d, #0060df); box-shadow: 0 1px 3px rgba(10,80,190,.2); }
  .dshell-listItem { flex-wrap: wrap; }
  /* toast */
  .wt-boot { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--wt-rad); border: var(--wt-hair); background: rgba(255,255,255,.88); color: var(--dsw-alias-label-primary, #0a1b33); font-size: 12.5px; box-shadow: var(--wt-shadow-1); }
  .wt-boot-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wt-blue); box-shadow: 0 0 0 4px rgba(10,132,255,.18); flex: none; }
  .wt-boot > div { flex: 1; }
  .wt-foot { display: flex; flex-direction: column; gap: 4px; text-align: center; font-size: 11.5px; color: var(--dsw-alias-label-tertiary, #8aa2c4); }
  .wt-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90; max-width: 82%; padding: 9px 16px; border-radius: 999px; border: var(--wt-hair); background: rgba(255,255,255,.96); -webkit-backdrop-filter: var(--wt-glass); backdrop-filter: var(--wt-glass); color: var(--dsw-alias-label-primary, #0a1b33); font-size: 12px; box-shadow: var(--wt-shadow-2); }
  .wt-toast[data-bad="true"] { border-color: rgba(255,59,48,.45); color: #a01d15; }
  @media (max-width: 720px) {
    .dshell { padding: 18px 14px 32px; gap: 20px; }
    .wt-hero { padding: 20px 18px; }
    .wt-display { font-size: 26px; }
    .wt-heroActions { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    .dshell-btn:hover { transform: none; }
  }
  /* 页内放映层 */
  .wt-reel{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#eaf1ff}
  .wt-reelbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #d3e2fb;background:rgba(255,255,255,.92)}
  .wt-reelbar b{font-size:12.5px;font-weight:600}
  .wt-reelbar .sp{flex:1}
  .wt-reelbar .path{font-size:10.5px;color:#5b6b83;word-break:break-all}
  .wt-reel iframe{flex:1;width:100%;border:0;background:#fff}
  .wt-link{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
  .wt-link:hover{color:#0060df;text-decoration:underline}

  if (e.target.id === "recQ") { state.q = e.target.value; state.recBusy = true; render(); var el0 = document.getElementById("recQ"); if (el0) { el0.focus(); el0.setSelectionRange(el0.value.length, el0.value.length); } return; }
  var fkey = e.target.getAttribute && e.target.getAttribute("data-f");
  if (fkey) { var p = fkey.split(":"); setF(p[0], p[1], e.target.value); return; }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.menu) { state.menu = false; render(); } });
function showReel(rel, title) {
  closeReel();
  var d = document.createElement("div");
  d.className = "wt-reel"; d.id = "wtReel";
  d.innerHTML = '<div class="wt-reelbar">' + icon("file") + "<b>" + esc(title || "产物放映") + "</b>" +
    '<span class="path">' + esc(rel) + '</span><span class="sp"></span>' +
    '<a class="dshell-btn dshell-btnGhost" href="' + esc(siteUrl(rel)) + '" target="_blank" rel="noopener">新标签</a>' +
    '<button type="button" class="dshell-btn" data-reel-close="1">返回工作台</button></div>' +
    '<iframe src="' + esc(siteUrl(rel)) + '" title="' + esc(title || "产物") + '"></iframe>';
  document.body.appendChild(d);
}
function closeReel() { var d = document.getElementById("wtReel"); if (d && d.parentNode) d.parentNode.removeChild(d); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeReel(); });

document.addEventListener("click", async function (e) {
  var el = e.target.closest ? e.target.closest("[data-reel],[data-reel-close],[data-f],[data-nav],[data-gen],[data-tab],[data-act],[data-ldone],[data-ldel],[data-step],[data-app]") : null;
  if (!el) return;
  var reel = el.getAttribute("data-reel");
  if (reel) { var rp = reel.split("|@|"); showReel(rp[0], rp[1]); return; }
  if (el.hasAttribute("data-reel-close")) { closeReel(); return; }
  var fv = el.getAttribute("data-f");
  if (fv && el.dataset.v != null) { var p = fv.split(":"); setF(p[0], p[1], el.dataset.v); render(); return; }
  var nav = el.getAttribute("data-nav");
  if (nav) {
    var parts = nav.split(":"), wz = wizById(parts[0]), cur = stepOf(wz.id), d = Number(parts[1]);
    if (d > 0 && !validate(wz, cur)) return;
    setStep(wz.id, Math.max(0, Math.min(wz.steps.length - 1, cur + d))); render(); return;
  }
  var gen = el.getAttribute("data-gen");
  if (gen) { var wg = wizById(gen); if (validate(wg, stepOf(wg.id))) await generate(wg); return; }
  var stp = el.getAttribute("data-step");
  if (stp != null) {
    var swz = wizById(el.getAttribute("data-w")), from = stepOf(swz.id), to = Number(stp);
    if (!(to >= 0 && to < swz.steps.length)) return;
    if (to > from) { for (var k = from; k < to; k++) if (!validate(swz, k)) return; }
    setStep(swz.id, to); render(); focusFirstField(swz.id); return;
  }
  var tab = el.getAttribute("data-tab");
  if (tab) { state.tab = tab; render(); if (tab === "rec" && state.ledger == null) await refreshLedger(); return; }
  var appId = el.getAttribute("data-app");
  if (appId != null) { await openApp(appId); return; }
  var rf = el.getAttribute("data-rec-filter");
  if (rf != null) { state.filter = rf; render(); return; }
  var act = el.getAttribute("data-act");
  if (act === "rec-refresh") { state.ledger = null; await refreshLedger(); await refreshFiles(); await loadApps(); render(); return; }
  if (act === "build") { await startBuild(); return; }
  if (act === "menu") { state.menu = !state.menu; render(); return; }
  if (act === "app-refresh") { await loadApps(); render(); return; }
  if (act === "app-rework") {
    var t = reworkText(appRows());
    if (!t) { toast("没有待验收的应用", true); return; }
    var okc = await copyText(t);
    toast(okc ? "返工单已复制，发给制作会话即可" : "复制失败，见 应用/<名>/自检/返工单.md", !okc);
    return;
  }
  if (act === "ai-open") { state.aiOpen = true; state.aiErr = ""; render(); var ta0 = document.getElementById("aiAsk"); if (ta0) ta0.focus(); return; }
  if (act === "ai-cancel") { state.aiOpen = false; state.aiErr = ""; render(); return; }
  if (act === "ai-mask") { if (e.target === el) { state.aiOpen = false; render(); } return; }
  if (act === "ai-go") { await aiSubmit(); return; }
  if (act === "ai-pull") { await pullDraft(false); return; }
  if (act === "refresh") { await refreshFiles(); return; }
  if (act === "reload") { location.reload(); return; }
  if (act === "collapse") { collapsePanes(); return; }
  if (act === "ledger-refresh") { state.ledger = null; await refreshLedger(); return; }
  var ldone = el.getAttribute("data-ldone");
  if (ldone) { await ledgerSetStatus(ldone, "已定版"); return; }
  var ldel = el.getAttribute("data-ldel");
  if (ldel) { await ledgerDelete(ldel); return; }
  if (act === "copy-prompt" && state.lastOut) { var okc = await copyText(state.lastOut.prompt); toast(okc ? "任务提示词已复制，粘到会话里发给 AI 即可" : "复制失败，请打开文件手动复制", !okc); return; }
});
function focusFirstField(wid) {
  var el = document.querySelector('[data-f^="' + wid + ':"]');
  if (!el || typeof el.focus !== "function") return false;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  if (typeof el.scrollIntoView === "function") {
    try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {
    }
  }
  return true;
}
function validate(w, cur) {
  var step = w.steps[cur], v = state.form[w.id] || {};
  var miss = step.fields.filter(function (fd) { return fd.req && !String(v[fd.k] || "").trim(); });
  if (miss.length) { var e = $("#werr"); if (e) e.textContent = "请先填写：" + miss.map(function (m) { return m.label; }).join("、"); toast("这一步还有必填项", true); return false; }
  return true;
}

/* ============================ 启动 ============================ */
buildDefs();
seedExample();
scanPanes();
render();
refreshFiles();
loadApps().then(function () { render(); if (appRows().some(function (a) { return a.status === "制作中"; })) startAppPoll(); });
if (state.tab === "rec") refreshLedger();
</script>
</body>
</html>
