<!doctype html>
<!-- 原型工作台 · 窗口1（重写版，单文件）
     界面只有三块：原型向导（4 步）→ 我的原型（清单）→ 放映层（页内看原型）。
     生成 = 写文件 + 自动新建会话 + 记台账；本工作台永远只占一张窗，多余产物窗自动收回。
     皮肤：/api/worktable/template/dshell.css，只用 dshell-* 组件类 + 少量自有结构；不引任何外部资源。
     接口：/api/worktable/fs | write | mkdir | file | site（全部同源）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型工作台</title>
<link rel="stylesheet" href="/api/worktable/template/dshell.css" />
<style>
  :root {

    --dsw-alias-bg-base: #eaf1ff;
    --dsw-alias-fill-l1: #ffffff;
    --dsw-alias-border-l1: #d3e2fb;

    --wt-grad-brand: linear-gradient(135deg, var(--dsw-alias-state-accent-primary, #0a84ff), var(--wt-indigo, #5e5ce6));
    --wt-ink: var(--dsw-alias-label-primary, #0b1b33);
  }
  html { background: #eaf1ff; }
  body { background: var(--dsw-alias-bg-base, #eaf1ff); color: var(--dsw-alias-label-primary, #0b1b33); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 440px; z-index: 0; pointer-events: none;
    background: radial-gradient(1100px 380px at 16% -14%, rgba(10,132,255,.20), transparent 62%),
                radial-gradient(760px 300px at 90% -10%, rgba(90,200,250,.18), transparent 60%); }
  body::after { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 440px; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(11,27,51,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(11,27,51,.055) 1px, transparent 1px);
    background-size: 34px 34px; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
  .dshell { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 40px; max-width: 1000px; margin: 0 auto; }
  .dshell-title { font-size: 32px; line-height: 1.14; font-weight: 600; letter-spacing: -.032em; margin: 0; }

  .dshell-input:focus, .dshell-textarea:focus { border-color: var(--dsw-alias-state-accent-primary, #0a84ff); box-shadow: 0 0 0 3px rgba(10,132,255,.16); outline: none; }
  .dshell-progress { height: 6px; border-radius: 999px; background: #dfeaf9; overflow: hidden; }

  :focus-visible { outline: 2px solid var(--dsw-alias-state-accent-primary, #0a84ff); outline-offset: 2px; }
  .dshell-btn:focus:not(:focus-visible) { outline: none; }
  .ic { display: inline-block; width: 1em; height: 1em; vertical-align: -.14em; flex: none; }
  /* —— 品牌区 / Hero —— */
  .wt-hero { position: relative; overflow: hidden; padding: 24px 26px 22px; border: var(--wt-hair); border-radius: var(--wt-rad-lg);
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.7));
    -webkit-backdrop-filter: saturate(1.5) blur(10px); backdrop-filter: saturate(1.5) blur(10px); box-shadow: var(--wt-card); }
  .wt-hero::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9) 30%, rgba(255,255,255,.9) 70%, transparent); }
  .wt-hero::after { content: ""; position: absolute; right: -90px; top: -120px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(10,132,255,.22), transparent 62%); pointer-events: none; }
  .wt-brand { position: relative; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wt-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--wt-grad-brand); color: #fff;
    box-shadow: 0 8px 18px -10px rgba(10,132,255,.95); }
  .wt-mark .ic { color: #fff; font-size: 16px; }
  .wt-brandName { font-size: 13px; font-weight: 600; letter-spacing: -.012em; }

  .wt-step[data-on="true"] i { border-color: transparent; background: linear-gradient(180deg, var(--dsw-alias-state-accent-primary, #0a84ff), var(--wt-blue, #0060df)); color: #fff; }

  .wt-err { font-size: 11.5px; color: var(--dsw-alias-state-danger, #a01d15); min-height: 16px; }
  .wt-nav { display: flex; gap: 8px; align-items: center; }
  .wt-nav .grow { flex: 1; }
  .wt-arch { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 10px; }
  .wt-acard { display: flex; flex-direction: column; gap: 7px; padding: 13px 14px; border-radius: var(--wt-rad-lg); border: var(--wt-hair);
    background: linear-gradient(180deg, #fff, #f7fbff); box-shadow: var(--wt-card); transition: border-color .22s var(--wt-ease); }
  .wt-acard[data-on="true"] { border-color: var(--dsw-alias-state-accent-primary, #0a84ff); box-shadow: 0 0 0 3px rgba(10,132,255,.10); }
  .wt-acard h4 { margin: 0; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .wt-acard h4 .ic { color: var(--dsw-alias-state-accent-primary, #0a84ff); }
  .wt-acard .sk { display: flex; gap: 5px; height: 34px; }
  .wt-acard .sk i { font-style: normal; border: 1px dashed var(--dsw-alias-border-l2, #b9d2f6); border-radius: var(--wt-rad); flex: 1;
    background: linear-gradient(180deg, rgba(10,132,255,.10), rgba(94,92,230,.06)); }
  .wt-acard p { margin: 0; font-size: 11.5px; color: var(--dsw-alias-label-secondary, #4a5b74); line-height: 1.55; }
  .wt-acard .refs { display: flex; flex-wrap: wrap; gap: 5px; }
  .wt-acard .refs a { font-size: 10.5px; color: var(--wt-blue, #0060df); text-decoration: none; border: var(--wt-hair); border-radius: 8px; padding: 2px 7px; background: rgba(255,255,255,.7); }
  .wt-acard .refs a:hover { border-color: var(--dsw-alias-state-accent-primary, #0a84ff); background: rgba(10,132,255,.07); }
  .wt-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 11.5px; color: var(--dsw-alias-label-secondary, #4a5b74); }
  .wt-reel { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; background: var(--dsw-alias-bg-base, #eaf1ff); }
  .wt-reelbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: var(--wt-hair); background: rgba(255,255,255,.94); }
  .wt-reelbar b { font-size: 12.5px; font-weight: 600; }
  .wt-reelbar .grow { flex: 1; }

  .wt-boot { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: var(--wt-rad-lg); background: var(--wt-glass); border: var(--wt-hair); box-shadow: var(--wt-card); }
  .wt-boot > div { flex: 1; }
  .wt-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 120; max-width: 84%; padding: 9px 15px; border-radius: var(--wt-rad);
    border: var(--wt-hair); background: #fff; color: var(--dsw-alias-label-primary, #0b1b33); font-size: 12px; box-shadow: var(--wt-pop); }
  .wt-toast[data-bad="true"] { border-color: rgba(160,29,21,.5); color: var(--dsw-alias-state-danger, #a01d15); }
  @media (max-width: 720px) {
    .dshell { padding: 18px 14px 30px; }
    .dshell-title { font-size: 25px; }
    .wt-hero { padding: 18px 16px; }
    .wt-display { font-size: 26px; }
    .wt-heroActions { margin-left: 0; width: 100%; }
    .wt-hero { padding: 18px 16px; }
    .wt-display { font-size: 26px; }
    .wt-heroActions { margin-left: 0; width: 100%; }
    .wt-arch { grid-template-columns: 1fr; }
    .dshell-table th:nth-child(3), .dshell-table td:nth-child(3),
    .dshell-table th:nth-child(4), .dshell-table td:nth-child(4) { display: none; }
    .dshell-table { font-size: 12px; }
    .dshell-table td.act { white-space: normal; }
    .dshell-table td.act .dshell-btn { margin: 2px 0 2px 6px; }
    .wt-add .dshell-input { max-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .dshell-btn:hover { transform: none; }
  }
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs id="wt-defs"></defs></svg>
<div class="dshell" id="app">
  <div class="wt-boot"><div><b>原型工作台 · 正在加载…</b><div class="dshell-muted">若这行字一直停着，说明页面脚本没执行。</div></div>
    <button type="button" class="dshell-btn dshell-btnGhost" onclick="location.reload()">重新载入</button></div>
</div>

<script>
"use strict";
/* ==================== 常量与工具 ==================== */
var ROOT = "WSROOT";
var OUT_DIR = "原型产出";
var LEDGER = "原型台账.json";
var LEDGER_MD = "原型台账.md";
var DEMO_SEED = [
  { id: "20261014-090000", at: "2026-10-14 09:00:00", name: "班组巡检闭环台", kind: "看板",
    files: ["原型产出/原型-20261014-090000-班组巡检闭环台.html", "原型产出/原型-20261014-090000-班组巡检闭环台-需求单.md"], session: "sess-demo1", status: "已定版", note: "示例记录（?demo=seed）" },
  { id: "20261014-091000", at: "2026-10-14 09:10:00", name: "设备点检台账", kind: "列表 + 详情",
    files: ["原型产出/原型-20261014-091000-设备点检台账.html"], session: null, status: "草稿", note: "示例记录（?demo=seed）" }
];
var SELF_FILES = ["原型工作台.html", "材料工作台.html", "应用工作台.html", "功能工作台.html", "司库账户全息画像.html", "蓝星应用.html", "拾零集.html"];
var BUILD = "10-14 14:20 认领整窗";
var LS = "dsh.worktable.protowb.v1";
var $ = function (s) { return document.querySelector(s); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });

function icon(n) { return '<svg class="ic" viewBox="0 0 16 16" fill="none" aria-hidden="true"><use href="#wt-' + n + '"/></svg>'; }
function toast(msg, bad) {

  clearTimeout(toast._t);
  toast._t = setTimeout(function () { $("#toast").innerHTML = ""; }, 4200);
}
async function api(path, body) {
  var r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
  var j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || ("HTTP " + r.status));
  return j || {};
}
function absOf(rel) { return ROOT + "/" + rel; }
function siteUrl(rel) { return "/api/worktable/site/" + encodeURIComponent(ROOT) + "/" + String(rel).split("/").map(encodeURIComponent).join("/"); }
function safeRel(rel) {
  var p = String(rel || "").trim();
  return !!p && p[0] !== "/" && p.indexOf("..") < 0 && p.indexOf("\\") < 0;
}
async function writeFile(rel, content) {
  if (!safeRel(rel)) throw new Error("路径越界：" + rel);
  return api("/api/worktable/write", { path: absOf(rel), content: content });
}
async function readText(rel) {
  var r = await fetch("/api/worktable/file?path=" + encodeURIComponent(absOf(rel)) + "&sessionId=", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.text();
}
async function listDir(rel) {
  var r = await api("/api/worktable/fs", { path: absOf(rel || ".") });
  return (r.entries || []).filter(function (e) { return !e.isDir && !/^\./.test(e.name) && !/\.bak/i.test(e.name); });
}
function cleanName(s) {
  return String(s || "").trim().replace(/[\/\\:*?"<>|\s]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "未命名";
}
function stamp() {
  var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function now() { return new Date().toLocaleString(); }
function lines(v) { return String(v || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
function pairs(v) {
  return lines(v).map(function (l) {
    var i = l.indexOf("=");
    return i < 0 ? { k: l, val: "" } : { k: l.slice(0, i).trim(), val: l.slice(i + 1).trim() };
  }).filter(function (x) { return x.k; });
}
function nums(s) { var m = String(s).match(/-?\d+(\.\d+)?/g); return m ? m.map(Number) : []; }
function load(k, def) { try { var v = localStorage.getItem(LS + "." + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(k, v) { try { localStorage.setItem(LS + "." + k, JSON.stringify(v)); } catch (e) {} }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    try {
      var ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
      return true;
    } catch (e2) { return false; }
  }
}

/* ==================== 图标（16×16 线性 SVG） ==================== */
var SHAPES = {
  layout: [{ r: [2, 2, 12, 12] }, { p: "M2 6.2h12" }, { p: "M6.6 6.2V14" }],
  kanban: [{ r: [1.9, 3, 3.4, 10] }, { r: [6.3, 3, 3.4, 7] }, { r: [10.7, 3, 3.4, 9] }],

  var main = (st.spec.main || []).filter(function (p) { return !ids[p.id]; });
  var top = (st.spec.top || []).filter(function (p) { return !ids[p.id]; });
  if (!main.length && !top.length) return { ok: false, msg: "收掉就没窗了，保留现状" };
  commitSpec(st, Object.assign({}, st.spec, { main: main, top: top.length ? top : null }));
  state.madePanes = state.madePanes.filter(function (x) { return !ids[x]; });
  save("panes", state.madePanes);
  return { ok: true, removed: w.hits.length };
}
function taskText(rel, specRel) {
  var v = state.form;
  return ["目标：把「" + (v.idea || "这个原型") + "」从原型推进成能用的应用。",
    "原型文件：" + absOf(rel),
    "需求单：" + absOf(specRel),
    "最想验证：" + (v.question || "-"),
    "给谁用：" + (v.users || "-"),
    "产出要求：单文件 HTML，用 /api/worktable/template/dshell.css 皮肤、只用 dshell-* 组件类、不引外部资源，文件放进项目文件夹。"
  ].join("\n");
}
async function newSession(text) {
  var env = hostGet("__dshCustomEnv"), custom = env && env.custom, err = "", st = wtStore();
  var pid = st && st.spec ? st.spec.id : null, pname = (st && st.spec && st.spec.title) || "本项目";
  if (custom && typeof custom.submit === "function") {
    try {
      var me = selfPane();
      var sid = await custom.submit(pid, pname, text, { kind: "none" }, me ? me.label : "");
      return { ok: true, sessionId: sid, via: "工作台" };
    } catch (e) { err = String(e && e.message || e); }
  }
  var sessions = hostGet("__dshSessions"), prompt = hostGet("__dshPromptIntoSession");
  if (!sessions || typeof sessions.create !== "function" || typeof prompt !== "function") {
    return { ok: false, msg: "没拿到会话接口" + (err ? "（插件通道：" + err + "）" : "") };
  }
  try {
    var r = await sessions.create({ cwd: ROOT });
    var sid2 = typeof r === "string" ? r : ((r && (r.sessionId || r.id)) || "");
    if (!sid2) return { ok: false, msg: "sessions.create 没返回会话 id" };
    await prompt(sid2, text);
    try { var op = hostGet("__dshOpenSession"); if (op) await op(sid2); } catch (e2) {}
    return { ok: true, sessionId: sid2, via: "宿主" };
  } catch (e3) { return { ok: false, msg: String(e3 && e3.message || e3) + (err ? "；插件通道：" + err : "") }; }
}

/* ==================== 台账 ==================== */
async function loadLedger() {
  state.ledgerErr = "";
  try {
    var j = JSON.parse(await readText(LEDGER));
    state.ledger = Array.isArray(j) ? j : [];
  } catch (e) {
    state.ledger = [];
    if (!/HTTP 404|HTTP 4/.test(String(e.message))) state.ledgerErr = "读台账失败：" + e.message;
  }
  return state.ledger;
}
function ledgerMd(rows) {
  var out = ["# 原型台账", "", "- 更新时间：" + now(), "- 共 " + rows.length + " 条", "",
    "| 时间 | 原型 | 形态 | 会话 | 状态 | 产出 |", "| --- | --- | --- | --- | --- | --- |"];
  rows.forEach(function (x) {
    out.push("| " + x.at + " | " + x.name + " | " + (x.kind || "-") + " | " + (x.session || "—") + " | " + (x.status || "草稿") + " | " +
      (x.files || []).map(function (p) { return absOf(p); }).join("<br>") + " |");
  });
  return out.join("\n");
}
async function saveLedger() {
  await writeFile(LEDGER, JSON.stringify(state.ledger, null, 2));
  await writeFile(LEDGER_MD, ledgerMd(state.ledger));
}
async function addLedger(rec) {
  state.ledger = [rec].concat(state.ledger).slice(0, 300);
  await saveLedger();
}
function findLedger(id) { return state.ledger.filter(function (x) { return x.id === id; })[0] || null; }
async function scanCandidates() {
  var have = {};
  state.ledger.forEach(function (x) { (x.files || []).forEach(function (p) { have[p] = 1; }); });
  var out = [];
  try {
    (await listDir(OUT_DIR)).forEach(function (e) {
      if (!/\.html$/i.test(e.name) || SELF_FILES.indexOf(e.name) >= 0) return;
      var rel = OUT_DIR + "/" + e.name;
      if (have[rel]) return;
      out.push({ rel: rel, name: e.name.replace(/^原型-\d{8}-\d{6}-/, "").replace(/\.html$/i, "") });
    });
  } catch (e) {}
  state.cands = out;
  return out;
}

/* ==================== 生成 ==================== */
async function ensureDir() {
  try { await api("/api/worktable/mkdir", { path: absOf(OUT_DIR) }); return true; }
  catch (e) { if (/exist|EEXIST|已存在/i.test(String(e.message))) return true; state.ledgerErr = "建目录失败：" + e.message; return false; }
}
async function generate() {
  var v = state.form;
  for (var i = 0; i <= state.step; i++) { if (!validate(i)) { state.step = i; render(); return; } }
  var name = cleanName(v.idea || "原型"), st = stamp();
  if (!(await ensureDir())) { toast(state.ledgerErr, true); return; }
  try {
    var rel = OUT_DIR + "/原型-" + st + "-" + name + ".html";
    var specRel = OUT_DIR + "/原型-" + st + "-" + name + "-需求单.md";
    await writeFile(rel, buildPrototype(Object.assign({}, v, { _stamp: st })));
    await writeFile(specRel, buildSpec(v, [rel, specRel]).join("\n"));
    state.lastOut = { stamp: st, name: name, rel: rel, spec: specRel, at: now() };
    save("last", state.lastOut);
    var s2 = await newSession(taskText(rel, specRel));
    await addLedger({ id: st, at: state.lastOut.at, name: name, kind: archById(v.arch).name,
      files: [rel, specRel], session: s2.ok ? s2.sessionId : null, status: "草稿", note: v.question || "" });
    var pr = prunePanes();
    await scanCandidates();
    toast("已生成 · 已记台账" + (s2.ok ? " · 新会话已开" : " · 会话没开成：" + (s2.msg || "桥不可用")), !s2.ok);
    render();
  } catch (e) { toast("写入失败：" + e.message, true); }
}

/* ==================== 放映 ==================== */
function showReel(rel, title) {
  closeReel();
  var d = document.createElement("div");
  d.className = "wt-reel"; d.id = "wtReel";
  d.innerHTML = '<div class="wt-reelbar">' + icon("play") + "<b>" + esc(title || "原型放映") + "</b>" +
    '<span class="path">' + esc(rel) + '</span><span class="grow"></span>' +
    '<button type="button" class="dshell-btn" data-reel-close="1">返回工作台</button></div>' +
    '<iframe src="' + esc(siteUrl(rel)) + '" title="' + esc(title || "原型") + '"></iframe>';
  document.body.appendChild(d);
}
function closeReel() { var d = document.getElementById("wtReel"); if (d && d.parentNode) d.parentNode.removeChild(d); }

/* ==================== 渲染 ==================== */
function fieldHtml(fd) {
  var val = f(fd.k);
  if (fd.type === "arch") {
    var cur = f("arch");
    return '<div class="wt-field"><label>' + esc(fd.label) + ' <span class="req">*</span></label><div class="wt-arch">' +
      ARCHETYPES.map(function (a) {
        return '<div class="wt-acard" data-on="' + (a.id === cur ? "true" : "false") + '"><h4>' + icon(a.icon) + esc(a.name) +
          (a.id === cur ? ' <span class="dshell-badge dshell-badgeDone">已选</span>' : "") + "</h4>" +
          '<div class="sk">' + a.sketch.map(function (x) { return '<i style="flex:' + x + '"></i>'; }).join("") + "</div>" +
          "<p>" + esc(a.use) + "</p>" +
          '<div class="refs">' + a.refs.map(function (r) {
            return '<a href="' + esc(r.url) + '" data-ext="' + esc(r.url) + '" rel="noopener">' + esc(r.label) + "</a>";
          }).join("") + "</div>" +
          '<div><button type="button" class="dshell-btn' + (a.id === cur ? " dshell-btnGhost" : "") + '" data-f="arch" data-v="' + a.id + '">' +
          (a.id === cur ? "已选" : "选这个") + "</button></div></div>";
      }).join("") + "</div></div>";
  }
  if (fd.type === "radio") {
    return '<div class="wt-field"><label>' + esc(fd.label) + '</label><div class="wt-opts">' +
      fd.opts.map(function (o, i) {
        var lab = fd.labels ? fd.labels[i] : o;
        return '<button type="button" class="dshell-btn dshell-btnGhost" data-on="' + ((val || fd.opts[0]) === o ? "true" : "false") + '" data-f="' + fd.k + '" data-v="' + esc(o) + '">' + esc(lab) + "</button>";
      }).join("") + "</div></div>";
  }
  if (fd.type === "multi") {
    var arr = multiOf(fd.k);
    return '<div class="wt-field"><label>' + esc(fd.label) + '</label><div class="wt-opts">' +
      fd.opts.map(function (o) {
        return '<button type="button" class="dshell-btn dshell-btnGhost" data-on="' + (arr.indexOf(o) >= 0 ? "true" : "false") + '" data-multi="' + fd.k + '" data-v="' + esc(o) + '">' + esc(o) + "</button>";
      }).join("") + "</div></div>";
  }
  if (fd.type === "textarea") {
    return '<div class="wt-field"><label>' + esc(fd.label) + (fd.req ? ' <span class="req">*</span>' : "") + '</label><textarea class="dshell-textarea" rows="4" data-f="' + fd.k + '" placeholder="' + esc(fd.ph || "") + '">' + esc(val) + "</textarea></div>";
  }
  return '<div class="wt-field"><label>' + esc(fd.label) + (fd.req ? ' <span class="req">*</span>' : "") + '</label><input class="dshell-input" data-f="' + fd.k + '" value="' + esc(val) + '" placeholder="' + esc(fd.ph || "") + '"/></div>';
}
function wizardHtml() {
  var total = STEPS.length, cur = Math.min(state.step, total - 1), step = STEPS[cur];
  return '<div class="dshell-card"><div class="wt-head">' + icon("layout") + "<b>原型向导</b>" +
    '<span class="grow"></span>' + (state.cands.length ? '<span class="dshell-badge">' + state.cands.length + ' 个产出未列入</span>' : "") + "</div>" +
    '<div class="wt-steps">' + STEPS.map(function (s, i) {
      return '<button type="button" class="wt-step" data-on="' + (i === cur ? "true" : "false") + '" data-done="' + (i < cur ? "true" : "false") + '" data-goto="' + i + '">' +
        "<i>" + (i < cur ? icon("check") : i + 1) + "</i>" + esc(s.title) + "</button>";
    }).join("") + "</div>" +
    '<div class="dshell-progress" style="margin-bottom:12px"><div class="dshell-progressBar" style="width:' + Math.round(((cur + 1) / total) * 100) + '%"></div></div>' +
    step.fields.map(fieldHtml).join("") +
    '<div class="wt-err" id="werr"></div>' +
    '<div class="wt-nav">' + (cur > 0 ? '<button type="button" class="dshell-btn dshell-btnGhost" data-nav="-1">上一步</button>' : "") +
    '<span class="grow"></span>' +
    (cur < total - 1 ? '<button type="button" class="dshell-btn" data-nav="1">下一步</button>'
      : '<button type="button" class="dshell-btn" data-gen="1">' + icon("plus") + " 生成原型</button>") +
    "</div></div>";
}
function ledgerHtml() {
  var rows = state.ledger, w = extraPanes();
  var bar = state.cands.length
    ? '<div class="wt-add">' + icon("bulb") + "还有 " + state.cands.length + " 个原型未列入" +
      '<select class="dshell-input" id="ledSel" style="width:auto;max-width:340px">' +
      state.cands.map(function (c) { return '<option value="' + esc(c.rel) + '">' + esc(c.rel) + "</option>"; }).join("") + "</select>" +
      '<button type="button" class="dshell-btn dshell-btnGhost" data-act="add-one">加入</button>' +
      '<button type="button" class="dshell-btn dshell-btnGhost" data-act="add-all">全部加入</button>' +
      '<button type="button" class="dshell-btn dshell-btnGhost" data-act="rescan">重新扫描</button></div>'
    : "";
  var body = rows.length
    ? '<div class="wt-scroll"><table class="dshell-table"><thead><tr><th>时间</th><th>原型</th><th>形态</th><th>会话</th><th>状态</th><th></th></tr></thead><tbody>' +
      rows.map(function (x) {
        return "<tr><td>" + esc(x.at) + "</td><td><b>" + esc(x.name) + "</b></td><td>" + esc(x.kind || "—") + "</td><td>" +
          esc(x.session ? String(x.session).slice(0, 8) : "—") + '</td><td><span class="dshell-badge ' +
          (x.status === "已定版" ? "dshell-badgeDone" : "dshell-badgeWait") + '">' + esc(x.status || "草稿") + "</span></td>" +
          '<td class="act"><button type="button" class="dshell-btn dshell-btnGhost" data-reel="' + esc(((x.files || [])[0] || "") + "|@|" + x.name) + '">放映</button> ' +
          '<button type="button" class="dshell-btn dshell-btnGhost" data-keep="' + esc(x.id) + '">定版</button> ' +
          '<button type="button" class="dshell-btn dshell-btnGhost" data-del="' + esc(x.id) + '">删记录</button></td></tr>';
      }).join("") + "</tbody></table></div>"
    : '<div class="dshell-muted">' + esc(state.ledgerErr || "还没有原型。走完向导点「生成原型」，这里出现第一条。") + "</div>";
  return '<div class="dshell-card"><div class="wt-head">' + icon("layers") + "<b>我的原型</b>" +
    '<span class="dshell-badge">' + rows.length + ' 条</span><span class="grow"></span>' +
    (w && w.hits.length ? '<button type="button" class="dshell-btn dshell-btnGhost" data-act="prune">收窗 ' + w.hits.length + "</button>" : "") + "</div>" +
    bar + body + "</div>";
}
function render() {
  $("#app").innerHTML = heroHtml() + wizardHtml() + ledgerHtml();
}
function heroHtml() {
  return '<section class="wt-hero"><div class="wt-brand">' +
    '<span class="wt-mark">' + icon("layers") + '</span><span class="wt-brandName">原型工作台</span>' +
    '<span class="wt-pill">' + esc(BUILD) + "</span>" +
    '<span class="wt-heroActions"><button type="button" class="dshell-btn dshell-btnGhost" data-act="reload">' + icon("refresh") + " 刷新</button></span></div>" +
    '<h1 class="wt-display">把想法<em>点成能跑的原型</em></h1></section>';
}

/* ==================== 校验与事件 ==================== */
function validate(i) {
  var miss = missingIn(STEPS[i]), el = $("#werr");
  if (!miss.length) { if (el) el.textContent = ""; return true; }
  if (el) el.textContent = "这一步还差必填：" + miss.map(function (m) { return m.label; }).join("、");
  toast("必填没填完", true);
  return false;
}
document.addEventListener("input", function (e) {
  var k = e.target.getAttribute && e.target.getAttribute("data-f");
  if (k) setF(k, e.target.value);
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeReel(); });
document.addEventListener("click", async function (e) {
  var el = e.target.closest ? e.target.closest("[data-f],[data-multi],[data-nav],[data-goto],[data-gen],[data-reel],[data-reel-close],[data-ext],[data-keep],[data-del],[data-act]") : null;
  if (!el) return;
  var k = el.getAttribute("data-f");
  if (k && el.dataset.v != null) {
    setF(k, el.dataset.v);
    if (k === "arch") applyRecipe(archById(el.dataset.v));
    render(); return;
  }
  var mk = el.getAttribute("data-multi");
  if (mk) { toggleMulti(mk, el.dataset.v); render(); return; }
  var nav = el.getAttribute("data-nav");
  if (nav) {
    var d = Number(nav);
    if (d > 0 && !validate(state.step)) return;
    state.step = Math.max(0, Math.min(STEPS.length - 1, state.step + d)); save("step", state.step); render(); return;
  }
  var go = el.getAttribute("data-goto");
  if (go != null) { state.step = Number(go); save("step", state.step); render(); return; }
  if (el.hasAttribute("data-gen")) { await generate(); return; }
  var reel = el.getAttribute("data-reel");
  if (reel) { var rp = reel.split("|@|"); showReel(rp[0], rp[1]); return; }
  if (el.hasAttribute("data-reel-close")) { closeReel(); return; }
  var ext = el.getAttribute("data-ext");
  if (ext) {
    var opened = false;
    try { opened = !!window.open(ext, "_blank", "noopener"); } catch (e2) { opened = false; }
    if (!opened) { var okc = await copyText(ext); toast(okc ? "弹窗被拦，链接已复制" : "链接：" + ext, !okc); }
    return;
  }
  var keep = el.getAttribute("data-keep");
  if (keep) {
    var x = findLedger(keep);
    if (x) { x.status = "已定版"; await saveLedger(); render(); toast("已定版：" + x.name); }
    return;
  }
  var del = el.getAttribute("data-del");
  if (del) {
    state.ledger = state.ledger.filter(function (y) { return y.id !== del; });
    await saveLedger(); await scanCandidates(); render(); toast("已移除记录（文件保留）");
    return;
  }
  var act = el.getAttribute("data-act");
  if (act === "reload") { await Promise.all([loadLedger(), scanCandidates()]); render(); toast("已刷新"); return; }
  if (act === "prune") {
    var pr = prunePanes();
    toast(pr.ok ? (pr.removed ? "已收掉 " + pr.removed + " 个多余窗" : "本来就只有一张窗") : "收窗失败：" + pr.msg, !pr.ok);
    render(); return;
  }
  if (act === "rescan") { await scanCandidates(); render(); toast(state.cands.length ? "发现 " + state.cands.length + " 个未列入原型" : "没有未列入的原型"); return; }
  if (act === "add-one" || act === "add-all") {
    var sel = document.getElementById("ledSel");
    var pick = act === "add-all" ? state.cands.slice() : state.cands.filter(function (c) { return sel && c.rel === sel.value; });
    if (!pick.length) { toast("没有可加入的项", true); return; }
    for (var i = 0; i < pick.length; i++) {
      await addLedger({ id: "reg-" + Date.now().toString(36) + "-" + i, at: now(), name: pick[i].name, kind: "已有原型",
        files: [pick[i].rel], session: null, status: "草稿", note: "" });
    }
    await scanCandidates(); render();
    toast(pick.length === 1 ? "已加入：" + pick[0].name : "已加入 " + pick.length + " 个原型");
    return;
  }
});

/* ==================== 启动（含验收用 demo 参数） ==================== */
function demoMode() {
  var m = (location.search || "").match(/demo=(\w+)/);
  return m ? m[1] : "";
}
function applyDemo() {
  var d = demoMode();
  if (d === "empty") { state.ledger = []; state.cands = []; return true; }
  if (d === "seed") { state.ledger = DEMO_SEED.slice(); state.cands = []; return true; }
  return false;
}

window.__bs = { ready: false, build: BUILD, ledger: 0, cands: 0, panes: 0, step: state.step, err: "" };
buildDefs();
render();
(async function () {
  if (!applyDemo()) await Promise.all([loadLedger(), scanCandidates()]);
  render();
  var pr = prunePanes();
  if (pr.ok && pr.removed) toast("已收掉 " + pr.removed + " 个多余窗，本工作台只留一张");
  claimPane("原型工作台");
  var st = wtStore();
  window.__bs.ledger = state.ledger.length;
  window.__bs.cands = state.cands.length;
  window.__bs.panes = st && st.spec ? paneList(st.spec).length : 0;
  var mine = selfPane();
  window.__bs.paneTitle = mine ? (mine.pane.title || "") : "";
  var at = mine && mine.pane.tabs ? (mine.pane.tabs[((mine.pane.active == null ? 0 : mine.pane.active) | 0)] || {}) : {};
  window.__bs.tabTitle = String(at.title || "");
  window.__bs.tabUrl = String((at.content && at.content.url) || "");
  window.__bs.ready = true;
})();
</script>
